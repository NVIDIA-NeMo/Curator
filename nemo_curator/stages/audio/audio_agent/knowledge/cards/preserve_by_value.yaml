stage_id: PreserveByValueStage
category: filter
summary: "Keep/drop rows by comparing a numeric or string field against a target value."
tags: [is_filter, batch_only]
model_id: null
domain: {language: any, style: any}
constraints:
  batch_size: {fixed: null, reason: "batch-only stage; process() raises, use process_batch"}
resource:
  cpus: 1.0
  gpu_mem_gb: 0.0
  gpu_optional: false
  bound: cpu
  throughput_hint: "CPU, trivial"
use_cases:
  good_for: ["thresholding one exact top-level scalar field (e.g. keep wer_pct <= 25 or duration >= 1.0)"]
  avoid_for: ["filtering before the field exists upstream", "nested values or dot-path traversal; expose the desired value as a flat top-level key first"]
composition:
  typical_upstream: [GetPairwiseWerStage, GetAudioDurationStage, UTMOSFilterStage]
  typical_downstream: [AudioToDocumentStage, ManifestWriterStage]
params_of_note:
  input_value_key: "exact top-level field to compare; dots are literal characters, not path separators"
  target_value: "the numeric (including float) or string value to compare against"
  operator: "one of lt, le, eq, ne, ge, gt"
  missing_value_policy: "'error' (default, backward-compatible) raises when input_value_key is absent; 'drop' removes that row."
semantic_facts:
  input_value_key:
    meaning: "This stage assigns no meaning to the selected field; it applies the configured comparison to the exact upstream value under input_value_key."
    unit: "inherited from the exact upstream producer"
    provenance: "The latest upstream writer or the input manifest supplies the value; PreserveByValueStage does not recompute or reinterpret it."
    scope: "the current top-level AudioTask row at this pipeline position, while the selected value may itself describe a parent, child, segment, recording, or corpus fact"
    propagation: "Rows passing operator(value, target_value) are preserved unchanged; failing rows are dropped. A missing key raises by default or is dropped only when missing_value_policy='drop'."
    counterexamples:
      - "A key name such as duration, score, or num_speakers does not prove which entity it describes; inspect its exact producer and any intervening fan-out or aggregation."
      - "A key such as metrics.wer is not resolved inside a metrics mapping; nested producer output must be extracted or flattened before this stage."
param_dependencies:
  input_value_key: "must be an exact top-level key produced upstream (e.g. wer_pct or duration)"
notes:
  - "Filter AFTER the metric it reads is produced; filtering early (before convert/write) saves downstream cost."
verified: {params: mechanical, semantic_facts: mechanical, tags: mechanical, resource: best_guess, use_cases: best_guess, domain: best_guess}
provenance: {model_card_url: null, card_version: 5, last_validated: "2026-09-22"}
