stage_id: SnippetManifestWriterStage
category: export
summary: "Append each (non-stub) ALM snippet's data as a JSONL line (snippet manifest sink)."
tags: [sink, writes_disk]
model_id: null
domain: {language: any, style: any}
constraints: {}
resource:
  cpus: 1.0
  gpu_mem_gb: 0.0
  gpu_optional: false
  bound: io
  throughput_hint: "append-per-snippet JSONL writes to separate replica shards"
use_cases:
  good_for: ["writing the ALM pretrain snippet manifest"]
  avoid_for: ["general manifests (use ManifestWriterStage)"]
composition:
  typical_upstream: [SnippetExtractionStage]
  typical_downstream: [PretrainMetricsAggregatorStage]
params_of_note:
  output_path: "final snippet manifest path and prefix for generated replica shards"
notes:
  - "Each replica appends to its own generated shard, not directly to output_path. Rows with snippet_id=None pass through without being written, so the metrics aggregator can count zero-snippet sources."
  - "Agent recipes require this writer, SnippetExtractionStage, and PretrainMetricsAggregatorStage together. Custom pipelines must prepare_audio_pretrain_outputs before execution and finalize_audio_pretrain_outputs after success; finalization merges shards into the requested manifest/tar/metrics bundle."
