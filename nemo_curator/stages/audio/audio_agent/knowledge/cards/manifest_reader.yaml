stage_id: ManifestReader
category: ingest
summary: "Read JSONL manifest(s) and emit one AudioTask per line (composite: partition + read)."
tags: []
model_id: null
domain: {language: any, style: any}
constraints: {}
resource:
  cpus: 1.0
  gpu_mem_gb: 0.0
  gpu_optional: false
  bound: io
  throughput_hint: "line-by-line file reads; all matching rows in a partition are materialized before return"
use_cases:
  good_for: ["starting a pipeline from an existing JSONL manifest (local or cloud S3/GCS)"]
  avoid_for: ["bootstrapping from a raw dataset with no manifest (use a CreateInitialManifest* stage)"]
composition:
  typical_upstream: []
  typical_downstream: [MonoConversionStage, ResampleAudioStage, GetAudioDurationStage]
params_of_note:
  manifest_path: "path or list of paths to JSONL manifests (local or cloud)"
  files_per_partition: "number of manifest files per partition (default 1)"
  blocksize: "target partition size (alternative to files_per_partition)"
  storage_options: "fsspec options for file discovery/partitioning only; the inner reader opens paths without forwarding these options"
  include_files: "optional list of audio paths; emit only manifest rows whose include_files_key resolves to one of these paths"
  include_files_key: "row field compared against include_files (default audio_filepath)"
conflicts_with: [ManifestReaderStage]   # the inner component; use one, not both
notes:
  - "Emitted AudioTasks are retained until the assigned file group is complete, including Python object overhead. Larger groups can increase memory use; include_files can reduce the retained results."
  - "Cloud reads require credentials/endpoints available to the reader's default fsspec configuration; storage_options on this composite does not configure the inner read."
  - "Composite of FilePartitioningStage + ManifestReaderStage; this is the stage to use directly (ManifestReaderStage is its inner read half)."
  - "include_files narrows rows within the same manifest reader, preserving the source-stage identity used by full and delta runs."
verified: {params: mechanical, tags: mechanical, resource: best_guess, use_cases: best_guess, domain: best_guess}
provenance: {model_card_url: null, card_version: 4, last_validated: "2026-10-19"}
