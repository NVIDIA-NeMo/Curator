stage_id: FastMSSRequests
summary: "Read a finite JSONL manifest of complete native FastMSS jobs."

category: ingest
model_id: null
domain: {language: any, style: any}
resource: {cpus: 1.0, gpu_mem_gb: 0.0, gpu_optional: false, bound: cpu}
provenance: {model_card_url: null, card_version: 1, last_validated: "2026-11-13"}
tags: []
params_of_note:

  native_inputs_path: "Read-only local tree covering YAML/defaults, embedded MonoCut manifests, all source audio, noise and fitting inputs. Core dependency hashing covers complete tree bytes."
  engine_path: "Explicit local FastMSS package directory; tracked through the existing dependency protocol."
  recipe_path: "Explicit sibling recipes directory with standard sim.py and packaged defaults; tracked as a dependency."
  request_key: "Planning-metadata field: config_path, n_meetings and duration; no waveform is implied."
io:
  dependency_params: [native_inputs_path, engine_path, recipe_path]
  source: {kind: manifest, path_param: manifest_path}
notes:
  - "A sampling unit is one complete native YAML job; n_meetings is preserved. Smoke caps invocations, not meetings. Source counts measure requests; fanout processing prevents inference of meeting rejection counts."
  - "Request rows are planning metadata, not audio records. Profiling provides row counts and metadata identity, not speech-quality measurements."
  - "Use FastMSSRequests followed by FastMSSRequestStage. No core protocol or schema extension is required."
  - "Only local file-backed embedded MonoCuts, native inputs in the declared tree and the standard recipe are supported. Remote/command audio sources, arbitrary config search roots and custom worker environments are unsupported here; use the original YAML API for those scopes."
  - "Changed YAML, defaults, speech, noise or engine files change the existing dependency identity. Generated outputs and caches must be outside every native input tree."
verified: {params: mechanical, tags: mechanical, resource: best_guess, domain: best_guess, io: mechanical, semantic_facts: mechanical}

semantic_facts:
  fastmss_request:
    meaning: "A complete native invocation: config_path plus effective n_meetings and duration planning bounds."
    unit: "one YAML job; n_meetings is a positive count and duration is seconds"
    provenance: "Original YAML composed with native defaults; no meetings have been generated yet."
    scope: "one request-manifest row"
    propagation: "Consumed by FastMSSRequestStage and replaced by up to n_meetings typed meeting AudioTasks."
    counterexamples: ["A request is neither a waveform nor a single meeting; request counts cannot be interpreted as retained-speaker or meeting yield."]
