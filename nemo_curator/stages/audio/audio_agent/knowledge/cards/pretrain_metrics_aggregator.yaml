stage_id: PretrainMetricsAggregatorStage
category: alm
summary: "Aggregate per-replica ALM pretrain metrics: append one JSONL record per task to a shard."
tags: [sink, writes_disk]
model_id: null
domain: {language: any, style: any}
constraints: {}
resource:
  cpus: 1.0
  gpu_mem_gb: 0.0
  gpu_optional: false
  bound: io
  throughput_hint: "append-per-task JSONL shard write"
use_cases:
  good_for: ["collecting drop/keep metrics across the ALM pretrain pipeline"]
  avoid_for: ["general curation (not an audio sink)"]
composition:
  typical_upstream: [SnippetExtractionStage, SnippetManifestWriterStage]
  typical_downstream: []
params_of_note:
  output_path: "final summary JSON destination and prefix for generated per-replica JSONL shards"
notes:
  - "Rows need a non-empty source id; rows without one are skipped. Input/drop counters come from task._metadata['pretrain_long_form'], populated by upstream pretrain stages; absent counters become zero, not a newly measured result."
  - "Agent recipes require SnippetExtractionStage and SnippetManifestWriterStage alongside this aggregator so the complete output bundle can be finalized."
  - "Per-task append (not teardown flush) is required under Xenna, which kills stage actors. finalize_audio_pretrain_outputs reads all shards after pipeline.run() and aggregates the summary JSON."
