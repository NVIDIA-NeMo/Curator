stage_id: FastMSSRequestStage
summary: Fulfil selected meeting requests in native bulk batches and emit one standard AudioTask per meeting.
category: ingest
model_id: null
domain:
  language: any
  style: any
resource:
  cpus: 1.0
  gpu_mem_gb: 0.0
  gpu_optional: false
  bound: cpu
provenance:
  model_card_url: null
  card_version: 4
  last_validated: '2026-11-13'
tags:
- writes_disk
params_of_note:
  native_inputs_path: Read-only local tree covering YAML/defaults, embedded MonoCut manifests and all prepared
    source WAVs. Lazy Lhotse transforms are rejected; materialize their results first.
  engine_path: Explicit local FastMSS package directory; tracked through the existing dependency protocol.
  recipe_path: Explicit sibling recipes directory with standard sim.py and packaged defaults; tracked as a dependency.
  request_key: Planning object identifying one requested meeting, its effective native job, ordinal and complete
    dependency fingerprint.
  request_id_key: Unique plan-bound meeting request identity, retained after the planning metadata is consumed.
  native_annotations_key: Mapping retaining every additional native manifest field without inventing top-level standard
    outputs.
  worker_lock_path: Planning-time JSON lock of the real worker Python, engine origin and dependency versions; validated
    by constructors and tracked through existing dependency hashing.
io:
  dependency_params:
  - native_inputs_path
  - engine_path
  - recipe_path
  - worker_lock_path
  outputs:
    output_dir:
      kind: audio_dir
notes:
- Admission enforces globally unique cut IDs across all splits of the native job. With save_spk=true, speaker
  labels must be filename-compatible, with no slash, backslash or NUL, and at most 200 UTF-8 bytes.
- Frozen YAML and worker temporary files are scoped under the per-run output directory independently of inherited
  TMPDIR/TEMP/TMP. Concurrent requests must not write temporary state into input dependency trees.
- Admission checks every supplied cut, including cuts that would not contribute to speaker capacity. Require matching
  declared/native sample rates, exactly one full-cut supervision, usable text/word timings and whitespace-free string
  speaker IDs. These metadata checks do not inspect waveform samples or silently normalize annotations.
- Each row requests exactly one whole meeting; first-N sampling generates at most N meetings. YAML counts are expanded
  during metadata planning without generating audio.
- Use FastMSSRequests -> FastMSSRequestStage -> existing consumers -> ManifestWriterStage. Requests contain no input
  waveform; source audio properties remain uninspected.
- Compatible selected requests share a native bulk invocation. Effective native acoustic settings and defaults are
  preserved; selected count, CPU allocation, output/cache locations and reference exports are adapter-managed.
- Worker settings are frozen from the fully resolved plan before applying those execution changes. Interpolated
  values and literal interpolation-like strings are preserved; serialization is checked before the engine runs.
- 'Initial scope: explicit YAML lists, inherited local defaults, ordinary Hydra overrides, prepared aligned embedded
  MonoCuts without lazy transforms. Noise/RIR generation, FA splitting, fitted transitions, remote/command sources, symlinks, external config
  search roots and custom workers remain native-API-only.'
- 'Admission limits: 10000 native files, 1 GiB input trees, 60 seconds hashing, 100000 planned requests, 300 seconds
  per meeting, 32 meetings per batch. Native generation timeout defaults to 3600 seconds, including preprocessing.'
- Exact fulfilment is mandatory; missing or excess generated meetings fail rather than becoming downstream filtering.
  Counts distinguish requested/generated meetings from retained meetings and original speech files.
- Complete speech/config/default, engine and recipe trees are tracked by existing dependency bindings on source
  and generator; stale requests fail before writes. Native PID seeds make byte-exact equivalence across invocation
  boundaries unsupported.
- Inputs must remain immutable throughout planning and execution. All generated audio, RTTM, logs, preprocessing
  and Hydra outputs are run-local under output_dir. Delta is unsupported because batches and randomness change results.
- A changed worker requires a new environment lock and request manifest. Source/generator construction rejects mismatched
  runtime versions before reuse; the persisted lock participates in source and generator identities.
verified:
  params: mechanical
  tags: mechanical
  resource: best_guess
  domain: best_guess
  io: mechanical
  semantic_facts: mechanical
deterministic: false
semantic_facts:
  audio_filepath:
    meaning: Generated mixed meeting waveform, retaining simultaneous speakers.
    unit: local path
    provenance: Installed FastMSS engine using prepared aligned speech.
    scope: one complete meeting
    propagation: One AudioTask per recording; additional manifest annotations are retained.
    counterexamples:
    - Not one isolated utterance or one speaker channel.
  duration:
    meaning: Finite positive mixture duration, including silence and overlap.
    unit: seconds
    provenance: FastMSS recording manifest; validated by the meeting reader.
    scope: whole meeting
    propagation: Copied without summing speaker turn durations.
    counterexamples:
    - Not the sum of overlapping speakers' speech durations.
  text:
    meaning: Reference transcripts joined in supervision start-time and ID order, including overlap.
    unit: nonempty string
    provenance: Source supervision transcripts; no ASR inference is run.
    scope: whole meeting
    propagation: One joined reference per AudioTask.
    counterexamples:
    - Not a time-aligned transcript or a disjoint sequence of ASR chunks.
  rttm_filepath:
    meaning: Existing generated diarization reference with overlapping speaker turns.
    unit: local RTTM path
    provenance: FastMSS reference annotations; no diarization model is run.
    scope: whole meeting
    propagation: Retained beside the meeting waveform.
    counterexamples:
    - Not predicted diarization or per-speaker dry audio.
  fastmss_annotations:
    meaning: Unmodified additional native meeting-manifest annotations retained in a mapping.
    unit: object mapping
    provenance: Native meeting manifest fields other than the four standard meeting outputs.
    scope: one generated meeting
    propagation: Preserved with the corresponding meeting; no upstream request fields are copied.
    counterexamples:
    - Not new quality measurements or original speech-corpus statistics.
  fastmss_request_id:
    meaning: Identity of the fulfilled meeting request, not a source speech utterance.
    unit: string
    provenance: Effective native configuration, all declared dependency bytes and request ordinal.
    scope: one requested/generated meeting
    propagation: One identity per emitted AudioTask; filtering retains its value.
    counterexamples:
    - Not an identity of one source speaker or one original corpus utterance.
