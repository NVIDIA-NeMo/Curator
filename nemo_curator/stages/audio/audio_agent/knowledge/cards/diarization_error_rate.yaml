stage_id: DiarizationErrorRateStage
category: quality
summary: "Score predicted speaker diarization against CHAT (.cha) reference transcripts (DER, miss, false alarm, confusion)."
tags: [produces_score]
model_id: null
domain: {language: any, style: conversational}
constraints: {}
resource:
  cpus: 1.0
  gpu_mem_gb: 0.0
  gpu_optional: false
  bound: cpu
  throughput_hint: "CPU; 10 ms frame scoring per recording"
use_cases:
  good_for: ["evaluating a diarization model on CallHome or another corpus with CHAT .cha references"]
  avoid_for: ["data without .cha reference transcripts", "RTTM references (not parsed)"]
composition:
  typical_upstream: [InferenceSortformerStage]
  typical_downstream: [ManifestWriterStage]
params_of_note:
  cha_dir: "directory with one <audio stem>.cha reference per recording"
  collar: "seconds ignored around every reference boundary (default 0.25)"
  diar_segments_key: "predicted {start, end, speaker} intervals (default diar_segments)"
  der_metrics_key: "output metrics dict (default der_metrics)"
param_dependencies:
  diar_segments_key: "requires an upstream diarization stage that stores intervals (e.g. InferenceSortformerStage)"
  cha_dir: "requires reference .cha transcripts named after each audio file stem"
semantic_facts:
  der_metrics:
    meaning: "Diarization error of the predicted intervals against the .cha reference: der, miss, fa, conf, correct (percent of reference speech), gt_speech_s, pred_speech_s, gt_speakers, pred_speakers."
    unit: "percent for der/miss/fa/conf/correct; seconds for *_speech_s; counts for *_speakers"
    provenance: "10 ms frames inside the reference span, collar excluded, after a greedy overlap-based speaker mapping."
    scope: "the whole recording in the current row"
    propagation: "Written as a nested dict (or None) under der_metrics_key; flatten a scalar before filtering on it."
    counterexamples:
      - "None means no .cha file, no reference speech, or no prediction inside the reference span -- not a perfect score."
      - "DER is lower-better and can exceed 100 when false alarms dominate."
metrics:
  der:
    scale: {min: 0.0, max: null, direction: lower_better}
comparison:
  accuracy_hint: "frame-level DER with collar; greedy (not optimal) speaker mapping"
  config_complexity: "low"
  known_limitations: "CHAT references only; greedy speaker mapping can overstate confusion versus an optimal assignment"
notes:
  - "The row is kept and der_metrics is set to None when it cannot be scored."
verified: {params: mechanical, semantic_facts: mechanical, tags: mechanical, resource: best_guess, use_cases: best_guess, domain: best_guess, comparison: best_guess}
provenance: {model_card_url: null, card_version: 5, last_validated: "2026-11-19"}
