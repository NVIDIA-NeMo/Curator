stage_id: ChannelCountStage
category: preprocess
summary: "Record, filter by, or convert the channel count -- one action per instance. annotate is the default; filter also applies count constraints; convert produces target_channels. Rows with unusable input may be dropped. It never resamples."
# is_filter because action='filter' drops rows and action='convert' with target_channels > 1
# refuses the conversions it cannot do correctly. The DEFAULT action does neither, so the tag is
# broader than the default contract's cardinality -- the same pairing OverlapFilterStage uses.
# Read `action` to know which behaviour you configured; cardinality_options names both.
tags: [is_filter]
model_id: null
domain: {language: any, style: any}
constraints: {}
resource:
  cpus: 1.0
  gpu_mem_gb: 0.0
  gpu_optional: false
  bound: cpu
  throughput_hint: "CPU. annotate/filter are header-only (soundfile.info), never decoding; convert decodes and runs torch mean/repeat over the waveform"
use_cases:
  good_for:
    - "recording channel counts without applying count constraints (action='annotate')"
    - "keeping only the rows that already have the channel count you need, without rewriting audio (action='filter')"
    - "normalizing stereo/multi-channel input to mono before models (action='convert')"
    - "pairing with SampleRateFilterStage when rate policy and channel policy should be set separately"
  avoid_for:
    - "changing the sample rate -- this stage never resamples; use ResampleAudioStage"
    - "downmixing surround to stereo (action='convert' with target_channels > 1 from more channels is REFUSED; ffmpeg via ResampleAudioStage knows channel layouts)"
    - "doing both at once -- selecting and converting are separate actions, and passing the other action's parameters is refused at construction rather than ignored"
composition:
  typical_upstream: [ManifestReader, SampleRateFilterStage, ResampleAudioStage, CreateInitialManifestReadSpeechStage]
  typical_downstream: [VADSegmentationStage, BandFilterStage, UTMOSFilterStage, SIGMOSFilterStage]
params_of_note:
  action: "'annotate' (default) records num_channels without count constraints; rows with no usable count are dropped. 'filter' additionally drops disallowed counts. 'convert' rewrites audio to target_channels. Parameters belonging to another action raise at construction."
  allowed_channels: "counts to keep, e.g. [1] for mono only (action='filter'). None (default) = no constraint from this parameter."
  min_channels: "lowest acceptable count, inclusive (action='filter'). None (default) = unbounded below."
  max_channels: "highest acceptable count, inclusive (action='filter'). None (default) = unbounded above."
  target_channels: "channel count to produce (action='convert'); None means 1 = mono. N->1 averages every channel. 1->T duplicates the mono channel T times. N->T where N > T > 1 is REFUSED (the row is dropped) because a correct surround downmix needs the file's channel layout, which a waveform tensor does not carry."
  keep_waveform_in_task: "keep the converted waveform in the task for the next stage (action='convert'; default True; in-memory, no disk)."
  write_to_disk: "OPT-IN (default False): also write the converted WAV to disk (action='convert'; pair with output_dir). Off by default -- that is why this card is not tagged writes_disk."
  input_residency: "'auto' (default) uses resident waveform shape before the file header; 'file' ignores resident audio; 'waveform' requires resident audio and never touches disk. With no path in auto/file mode, a valid declared count is accepted with an unverified warning."
  audio_filepath_key: "file input key (default audio_filepath); configure it to the actual routed artifact when reading a prior disk transform"
semantic_facts:
  action:
    meaning: "Which of the three things this instance does about the channel count: record it, select on it, or change it."
    propagation: "annotate/filter drop rows whose count cannot be obtained; filter also drops disallowed counts. convert drops unreadable or unsupported conversions."
    counterexamples:
      - "action='convert' with target_channels=1 does NOT drop non-mono rows -- it converts them. To keep only rows that are already mono, use action='filter' with allowed_channels=[1]."
      - "action='filter' with allowed_channels=[1] does NOT make anything mono -- it discards whatever is not. Choosing wrongly between the two either destroys most of a stereo corpus or silently leaves it unconverted."
      - "Passing another action's parameters raises at construction; it is never silently ignored."
  num_channels:
    meaning: "The source channel count under annotate/filter, or resulting count under convert; metadata-only fallback is unverified."
    unit: "channels (integer >= 1)"
    provenance: "annotate/filter use waveform shape or a file header according to input_residency. With no path and no resident observation in the selected mode, they accept a positive integral declared count with a warning. convert writes the produced count."
    scope: "One row / one audio file."
    propagation: "Writes the resolved count. A header/shape observation replaces stale metadata; the metadata-only fallback does not verify it."
    counterexamples:
      - "After filter this describes the source, with the provenance caveat above; after convert it describes the result. Check which stage last wrote a count or rate before using it."
      - "Not a promise the corpus is uniform: with a range or a multi-value allowed_channels the survivors can still hold several different counts."
  target_channels:
    meaning: "The channel count action='convert' produces. Not a rate, and not a selection criterion."
    unit: "channels (integer >= 1)"
    propagation: "Writes num_channels (the resulting count). Duplicating mono into T channels adds no information: the result is the same signal T times."
    counterexamples:
      - "target_channels=2 does NOT downmix 5.1 to stereo -- that row is dropped with a warning. Use ResampleAudioStage, which drives ffmpeg and knows channel layouts."
      - "This stage never resamples. Pair it with SampleRateFilterStage (select rates) or ResampleAudioStage (convert rates)."
      - "Upmix is duplication, so a 2-channel result may be synthetic stereo rather than a genuine two-channel recording."
comparison:
  SampleRateFilterStage: "the rate-side counterpart: records every row's sample rate and keeps the acceptable ones, header-only. Pairs with this stage when both policies matter."
  ResampleAudioStage: "converts rate and channels via ffmpeg on disk, and knows channel layouts. Use it to change a sample rate, or for a surround downmix action='convert' refuses."
  MonoConversionStage: "an alternative that applies a mono downmix and a single-rate gate together. Use this stage instead when channel policy and rate policy should be set independently."
notes:
  - "ResampleAudioStage writes resampled_audio_filepath by default and leaves audio_filepath unchanged. To inspect or convert the resampled artifact, point audio_filepath_key at that output, consume a retained waveform, or configure the resampler to update audio_filepath."
verified: {params: mechanical, semantic_facts: mechanical, tags: mechanical, resource: best_guess, use_cases: best_guess, domain: best_guess}
provenance: {model_card_url: null, card_version: 4, last_validated: "2026-10-19"}
