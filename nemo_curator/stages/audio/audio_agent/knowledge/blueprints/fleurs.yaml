blueprint_id: fleurs-asr-wer-filter
intent: "transcribe reference-labeled speech and select rows by WER; FLEURS is the bundled dataset example"
data_assumptions: {input: "reference-labeled audio; bundled recipe downloads FLEURS", transcripts: present, sr: any}
produces: "JSONL manifest with pred_text and wer_pct (percentage), retaining rows at or below the configured WER limit"
recipe_ref: recipes/fleurs_asr_filter.yaml

source_selection:
  - "existing JSONL with reference text: ManifestReader"
  - "FLEURS: CreateInitialManifestFleursStage with the intended lang/split; this is the bundled recipe's source"
  - "a plain audio folder supplies no reference text by itself; establish references before applying WER"

stages:
  - {ref: CreateInitialManifestFleursStage, tag: advisory, why_here: "FLEURS-specific source example; substitute a manifest reader for other reference-labeled corpora"}
  - {ref: ASRStage, tag: advisory, why_here: "produce hypotheses when absent; select an adapter/checkpoint for the language and input constraints"}
  - {ref: GetPairwiseWerStage, tag: enforced, why_here: "compute wer_pct from configured reference/hypothesis keys; existing hypotheses need no ASR"}
  - {ref: GetAudioDurationStage, tag: advisory, why_here: "optional duration annotation for reporting"}
  - {ref: PreserveByValueStage, tag: advisory, why_here: "select on wer_pct only after it exists; lower WER is better"}
  - {ref: ManifestWriterStage, tag: enforced, why_here: "write serializable AudioTask metadata"}

pitfalls:
  - "The bundled English model and 25% limit are example choices, not defaults suitable for every language or quality target."
  - "GetPairwiseWerStage writes wer_pct in percent: 25.0 means 25%, not 0.25. Align the filter and acceptance limit."
  - "Missing reference text prevents WER evaluation, not transcription. A blank hypothesis against a non-empty reference scores 100% WER."
  - "FLEURS source parameters do not describe an arbitrary manifest or audio directory."
presets:
  english_parakeet: {model_id: "nvidia/parakeet-tdt-0.6b-v2", target_value: 25.0}
provenance: {derived_from: "tutorials/audio/fleurs", version: 2}
