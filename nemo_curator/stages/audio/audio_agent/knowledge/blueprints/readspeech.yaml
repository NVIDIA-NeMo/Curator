blueprint_id: readspeech-quality-filter
intent: "quality-filter speech; choose whole-file or segment scope from the requested output"
data_assumptions: {input: "audio files or an existing JSONL manifest", transcripts: optional, sr: any}
produces: "JSONL metadata for retained audio items; scores describe the chosen file/segment scope"
recipe_ref: recipes/readspeech_quality.yaml

source_selection:
  - "folder without a manifest: CreateInitialManifestAudioFolderStage"
  - "existing JSONL manifest: ManifestReader; preserve its annotations"
  - "known dataset: use its dataset-specific source only when provenance matches, e.g. CreateInitialManifestReadSpeechStage for DNS Read Speech"

# AudioDataFilterStage merges these settings with defaults; both booleans must be explicit.
topology_selection:
  rule: "choose granularity from intent; every flag below is under AudioDataFilterStage.config"
  options:
    - {intent: "whole-file scores", flags: {vad: {enable: false}, speaker_separation: {enable: false}}, shape: "Mono -> Filters -> TimestampMapper"}
    - {intent: "per-speech-segment scores", flags: {vad: {enable: true}, speaker_separation: {enable: false}}, shape: "Mono -> VAD(fanout) -> Filters -> TimestampMapper"}
    - {intent: "per-speaker scores", flags: {vad: {enable: false}, speaker_separation: {enable: true}}, shape: "Mono -> Filters -> SpeakerSep(fanout) -> Filters -> TimestampMapper"}
    - {intent: "per-speaker-segment scores", flags: {vad: {enable: true}, speaker_separation: {enable: true}}, shape: "Mono -> VAD(nested) -> Filters -> SegConcat -> SpeakerSep -> VAD -> Filters -> TimestampMapper"}

# Logical components; the recipe uses AudioDataFilterStage for mono, filters and mapping.
stages:
  - {ref: CreateInitialManifestAudioFolderStage, tag: advisory, why_here: "folder-source example; substitute ManifestReader for existing manifests"}
  - {ref: MonoConversionStage, tag: advisory, why_here: "downmix for the quality chain; strict_sample_rate=False disables rate-based rejection"}
  - {ref: VADSegmentationStage, tag: advisory, why_here: "optional segmentation when scores should describe speech segments"}
  - {ref: BandFilterStage, tag: advisory, why_here: "optional bandwidth gate only when required by the quality policy"}
  - {ref: UTMOSFilterStage, tag: advisory, why_here: "overall perceptual speech-quality proxy"}
  - {ref: SIGMOSFilterStage, tag: advisory, why_here: "dimension-specific speech-quality proxies; enable only the gates the request needs"}
  - {ref: AudioToDocumentStage, tag: enforced, why_here: "strict_json=True establishes a serializable DocumentBatch boundary"}
  - {ref: DocumentBatchJsonlWriterStage, tag: enforced, why_here: "write the DocumentBatch as JSONL"}

pitfalls:
  - "The template scores whole files and retains original-file references; it does not export new audio clips. Segmentation and separation change scope; separation also transforms audio."
  - "MonoConversionStage does not resample. The template disables its strict rate gate and BandFilter; UTMOS and SIGMOS resample internally. Add explicit conversion only for consumers that need it, and wire them to the converted carrier."
  - "ASR needs audio, not reference transcripts. WER needs both reference and hypothesis text; existing conforming text can be reused."
  - "Thresholds and retention are workload-dependent policy choices, not quality guarantees. Use representative score/output evidence; do not predict yield from another dataset."
  - "These quality predictors target speech, not arbitrary music or non-speech audio. Check each model's limits before applying the template."
  - "AudioDataFilterStage's TimestampMapper removes known audio carriers but does not declare general JSON safety. The template adds AudioToDocumentStage(strict_json=True) before the DocumentBatch writer."
presets:
  tts_reference: {mos_threshold: 4.0}
  asr_finetune: {mos_threshold: 3.4}
  max_retention: {mos_threshold: 3.0}
provenance: {derived_from: "tutorials/audio/readspeech; generalized against current stage contracts", version: 3}
