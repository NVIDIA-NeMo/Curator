stage_id: ComputeWERStage
category: quality
summary: "Compute WER/CER (plus edge-CER and optional PNC WER/CER) between hypothesis and reference text."
tags: [produces_score]
model_id: null
domain: {language: "configurable (default en)", style: any}
constraints: {}
resource:
  cpus: 1.0
  gpu_mem_gb: 0.0
  gpu_optional: false
  bound: cpu
  throughput_hint: "CPU; text cleaning + normalization (NeMo text processing)"
use_cases:
  good_for: ["measuring ASR accuracy (normalized WER/CER, edge-CER, PNC) for filtering", "per-segment scoring"]
  avoid_for: ["data with no reference transcripts (WER is unproducible)"]
composition:
  typical_upstream: [ASRStage, NeMoASRAlignerStage]
  typical_downstream: [PreserveByValueStage, AudioToDocumentStage]
params_of_note:
  language: "language for text normalization (default en)"
  hypothesis_text_key: "ASR prediction key (default text)"
  reference_text_key: "reference transcript key (default text_ref)"
  compute_pnc_wer: "also compute punctuation-and-capitalization WER/CER"
  edge_length: "characters at each edge for edge-CER"
param_dependencies:
  hypothesis_text_key: "requires an upstream ASR prediction"
  reference_text_key: "requires reference transcripts in the source manifest"
semantic_facts:
  metrics:
    meaning: "Error-rate scores comparing an ASR HYPOTHESIS against a REFERENCE transcript (nested: metrics.wer.wer, metrics.cer.cer, plus edge/PNC variants)."
    unit: "fractions; WER/CER are error rates in [0, ~2] (can exceed 1.0 when insertions dominate)"
    provenance: "word_error_rate_detail over the NORMALIZED hypothesis_text_key vs reference_text_key text; REQUIRES both to be present."
    scope: "per segment when segments_key is present, else the top-level row"
    propagation: "Written under metrics_key; there is no inline threshold -- filter downstream with PreserveByValueStage."
    counterexamples:
      - "WER is unproducible without reference transcripts (reference_text_key, default text_ref) -- it measures transcript accuracy, NOT an audio property, and cannot be computed from audio alone."
      - "WER/CER are LOWER-better error rates: to keep accurate clips, DROP those ABOVE the threshold (a >= cut), not below."
metrics:
  # ComputeWER writes nested dicts under metrics_key (metrics.wer.wer, metrics.cer.cer,
  # plus edge/PNC variants). There is NO inline threshold param -- filter downstream with
  # PreserveByValueStage. Directions are declared so the planner never inverts the filter:
  # WER/CER are error rates, so LOWER is better (drop clips ABOVE the threshold).
  wer:
    scale: {min: 0.0, max: 1.0, direction: lower_better}
    valid_range: [0.0, 2.0]          # WER can exceed 1.0 when insertions dominate
  cer:
    scale: {min: 0.0, max: 1.0, direction: lower_better}
    valid_range: [0.0, 2.0]
comparison:
  accuracy_hint: "normalized, multi-metric (WER/CER/edge/PNC), operates on segments"
  config_complexity: "medium (language + PNC + thresholds)"
  known_limitations: "requires references; normalization is language-dependent"
conflicts_with: [GetPairwiseWerStage]   # overlapping WER computation
notes:
  - "Cleans/normalizes text via NeMo text processing before scoring. Writes results under metrics_key."
verified: {params: mechanical, semantic_facts: mechanical, tags: mechanical, resource: best_guess, use_cases: best_guess, domain: best_guess, comparison: best_guess}
provenance: {model_card_url: null, card_version: 3, last_validated: "2026-07-30"}
