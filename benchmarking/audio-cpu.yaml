# audio_cpu benchmark overrides.
#
# Layer this file after benchmarks.yaml in an image built with
# CURATOR_EXTRA=audio_cpu and started without GPUs, and select the
# CPU-only entries:
#   --config benchmarking/benchmarks.yaml --config benchmarking/audio-cpu.yaml
#   --entries "alm_pipeline or whisper_hallucination"
#
# Only these entries are valid here: their stages request no GPUs (ALM builder
# and overlap, the Whisper hallucination text filter, manifest I/O). The other
# audio entries run GPU stages and are not valid on this install.

ray:
  num_gpus: 0
gpu_stats_recorder:
  interval_s: 0
