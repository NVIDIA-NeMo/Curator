  - name: nemotron_parse_pdf_xenna
    enabled: true
    script: nemotron_parse_pdf_benchmark.py
    args: >-
      --benchmark-results-path={session_entry_dir}
      --executor=xenna
      --manifest={dataset:nemotron_parse_pdf,manifest}
      --pdf-dir={dataset:nemotron_parse_pdf,pdf_dir}
      --output-dir={session_entry_dir}/scratch/output
      --model-path={dataset:nemotron_parse_pdf_model,files}
      --backend=vllm
      --enforce-eager
      --pdfs-per-task=20
      --max-pdfs=1278
      --max-pages=10
      --max-num-seqs=64
    timeout_s: 1200
    sink_data:
      - name: slack
        additional_metrics:
          - num_pdfs_processed
          - num_pages_processed
          - num_output_tokens
          - num_output_tasks
          - throughput_pages_per_sec
          - throughput_output_tokens_per_sec
        ping_on_failure:
          - U082G3E46R0  # Abhinav Garg
    requirements:
      # Exact counts: the dataset is fixed and every file in it renders, so a
      # correct run reproduces these precisely. Verified identical across three
      # runs on both executors. Any drift means PDFs are being dropped, which is
      # the failure this entry exists to catch.
      - metric: num_pdfs_processed
        exact_value: 1278
      - metric: num_pages_processed
        exact_value: 5794
      # Throughput floors rather than exact values: wall-clock moves with cluster
      # load. Observed 8.5-8.9 pages/s and 7166-7482 output tokens/s across both
      # executors, so these sit ~15-18% below the slowest measurement -- tight
      # enough to catch a real regression, loose enough not to flake.
      # The token rate is asserted as well as the page rate so that swapping the
      # inference backend (e.g. to Dynamo) has to preserve generation throughput,
      # not just page throughput. It is a rate, not a count: exact token counts
      # are not reproducible under dynamic batching.
      - metric: throughput_pages_per_sec
        min_value: 7.0
      - metric: throughput_output_tokens_per_sec
        min_value: 6000
      # Total generated tokens, asserted as a band rather than an exact value.
      # Dynamic batching shifts where the model emits EOS, so the count is not
      # reproducible the way the page count is -- but it is stable to within 1%.
      # Measured across 10 runs (both executors): 4,852,596 to 4,897,124, mean
      # 4,872,307, total spread 0.91%. The band is +/-5% of that mean, ~10x the
      # observed drift, so it will not flake but will still catch a change in
      # what the model generates -- e.g. swapping the inference backend for one
      # that is materially more or less verbose, which a throughput floor alone
      # would miss.
      - metric: num_output_tokens
        min_value: 4630000
        max_value: 5115000

