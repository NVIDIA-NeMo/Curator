# Override config for video-only ad-hoc benchmark runs on EOS H100.
# Usage:
#   ./benchmarking/tools/run.sh \
#     --use-host-curator \
#     --config benchmarking/nightly-benchmark.yaml \
#     --config benchmarking/video-only-override.yaml
#
# NOTE: requires coreai_dlalgo_ci group membership to access datasets.
# Ask Rick (rratzel) or Ayush (adattagupta) to add weijiac to the group.

paths:
  - name: results_path
    host_path: /lustre/fsw/coreai_dlalgo_llm/weijiac/benchmark_results
  - name: datasets_path
    host_path: /lustre/fsw/coreai_dlalgo_ci/curator_ci/datasets
  - name: model_weights_path
    host_path: /lustre/fsw/coreai_dlalgo_ci/curator_ci/model_weights

run_reason: "NMCUR-249 uniform video sampling — ad-hoc validation"

viewer_url_template: "http://rratzel-ws1:5050/run-viewer?dir=login-eos%3A{results_path_url}&run={session_name_url}"

# Disable all non-video entries
entries:
  - name: domain_classification_raydata
    enabled: false
  - name: domain_classification_xenna
    enabled: false
  - name: embedding_generation_raydata
    enabled: false
  - name: embedding_generation_xenna
