# Data setup entries for benchmark inputs that are prepared once and reused by
# nightly benchmark entries.
#
# Pass this file to benchmarking/tools/run.sh with:
#   --config benchmarking/nightly-data-setup.yaml

data_setups:
  - name: fleurs_hy_am
    enabled: true
    script: prepare_fleurs_data.py
    args: >-
      --output-path {datasets_path}/fleurs
      --cache-dir {datasets_path}/_hf_cache/fleurs

  - name: audio_tagging_ami_sdm
    enabled: true
    script: prepare_audio_tagging_data.py
    args: >-
      --output-path {datasets_path}/audio_tagging_ami_sdm
      --cache-dir {datasets_path}/_hf_cache/audio_tagging
      --model-output-path {model_weights_path}/audio_tagging/pyannote-speaker-diarization-community-1

  - name: audio_sortformer_ami_sdm
    enabled: true
    script: prepare_audio_sortformer_data.py
    args: >-
      --output-path {datasets_path}/audio_sortformer_ami_sdm
      --cache-dir {datasets_path}/_hf_cache/audio_sortformer
      --model-output-path {model_weights_path}/audio_sortformer/diar_streaming_sortformer_4spk-v2.1.nemo
