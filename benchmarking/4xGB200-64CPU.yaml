      --benchmark-results-path={session_entry_dir}
      --input-path={dataset:commoncrawl,jsonl}
      --dataset-size-gb=1
      --output-path={session_entry_dir}/scratch/output
      --inference-server-type=dynamo
      --model-id=openai/gpt-oss-20b
      --model-path={model_weights_path}/text_model_weights/hf_cache/models--openai--gpt-oss-20b/snapshots/6cee5e81ee83917806bbde320786a8fb61efebee
      --executor=ray_data
