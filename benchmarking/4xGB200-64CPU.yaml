# 4xGB200-64CPU benchmark overrides.
#
# Layer this file after benchmarks.yaml for a 4-GPU, 64-CPU GB200 environment.
# This override halves the default Ray CPU/GPU resources, increases timeout
# values within the existing 3h59m job-runtime ceiling, and adjusts
# workload-specific scaling settings. Known historical 4-GPU video throughput
# requirements are included here; other performance requirements are inherited
# from benchmarks.yaml until 4xGB200-64CPU-specific baselines are measured and added.
#
# NDD entries override their serving replica count from 8 to 4.
# Their current 8x performance thresholds
# are inherited because the older dp4 thresholds predate later workload changes.

default_timeout_s: 14340
max_timeout_s: 14340
cleanup_timeout_s: 60
min_timeout_s: 600
# 400 GiB leaves headroom for 4xGB200-64CPU jobs whose /dev/shm may be smaller
# than the default 500 GiB object store used by benchmarks.yaml.
object_store_size: 429496729600
ray:
  num_cpus: 64
  num_gpus: 4
  enable_object_spilling: false
entries:
  - name: domain_classification_raydata
    timeout_s: 2400

  - name: domain_classification_xenna
    timeout_s: 2400

  - name: embedding_generation_raydata
    timeout_s: 2400
    requirements:
      - metric: throughput_docs_per_sec
        min_value: 4000

  - name: embedding_generation_xenna
    timeout_s: 2400
    requirements:
      - metric: throughput_docs_per_sec
        min_value: 4000

  - name: exact_dedup_identification
    timeout_s: 2400

