# 26.07 has no custom MinHash read/compute/write timing instrumentation.
# Do not treat absent measurements as passing; keep count and throughput checks.
entries:
  - name: minhash_file_group_task_ray_actors
    requirements: &unavailable_minhash_timings
      - metric: minhash_compute_worker_time_s_mean
        enabled: false
      - metric: minhash_input_prep_worker_time_s_mean
        enabled: false
      - metric: minhash_write_worker_time_s_mean
        enabled: false
  - name: minhash_file_group_task_xenna
    requirements: *unavailable_minhash_timings
  - name: minhash_file_group_task_ray_data
    requirements: *unavailable_minhash_timings
  - name: minhash_document_batch_xenna
    requirements: *unavailable_minhash_timings
  - name: minhash_document_batch_ray_data
    requirements: *unavailable_minhash_timings
  - name: minhash_document_batch_ray_data_num_workers_8
    requirements: *unavailable_minhash_timings
