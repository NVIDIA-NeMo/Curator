name: Publish Fern Docs

on:
  push:
    tags:
      - 'docs/v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  FERN_NO_VERSION_REDIRECTION: "true"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'

      - name: Install fixed Fern CLI
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/fern-cli" --ignore-scripts --no-audit --no-fund fern-api@5.123.0
          printf '%s\n' '{"organization":"nvidia","version":"5.123.0"}' > fern/fern.config.json

      - name: Generate library reference MDX (autodocs)
        env:
          FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}
        working-directory: ./fern
        run: '"$RUNNER_TEMP/fern-cli/node_modules/.bin/fern" docs md generate --library nemo-curator'

      - name: Publish Docs
        env:
          FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}
        working-directory: ./fern
        run: '"$RUNNER_TEMP/fern-cli/node_modules/.bin/fern" generate --docs'
