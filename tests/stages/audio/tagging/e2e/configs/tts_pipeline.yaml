# TTS Audio Tagging Pipeline - E2E Test Configuration
#
# Mirrors tutorials/audio/tagging/tts_pipeline.yaml with test-friendly defaults.
# Stages use _target_ for Hydra instantiation via create_pipeline_from_yaml.

input_manifest: ???
final_manifest: ???
workspace_dir: /tmp/tagging_test_workspace
resampled_audio_dir: ${workspace_dir}/audio_resampled
language_short: en
hf_token: ""
sample_rate: 16000
max_segment_length: 40
resources:
  cpus: 1

stages:
  # 0. Read input manifest
  - _target_: nemo_curator.stages.audio.common.ManifestReader
    manifest_path: ${input_manifest}
    files_per_partition: 1

  # 1. Resample audio to 16 kHz mono WAV
  - _target_: nemo_curator.stages.audio.tagging.ResampleAudioStage
    name: "ResampleAudio"
    resampled_audio_dir: ${resampled_audio_dir}
    input_format: "wav"
    target_sample_rate: ${sample_rate}
    target_format: "wav"
    target_nchannels: 1
    resources: ${resources}

  # 2. Speaker diarization (PyAnnote)
  - _target_: nemo_curator.stages.audio.inference.speaker_diarization.stage.InferenceSortformerStage
    name: "PyAnnoteDiarization"
    adapter_target: nemo_curator.models.audio.speaker_diarization.pyannote.PyAnnoteDiarizationAdapter
    model_id: pyannote/speaker-diarization-3.1
    audio_filepath_key: resampled_audio_filepath
    diar_segments_key: segments
    overlap_segments_key: overlap_segments
    num_speakers_key: null
    global_speaker_ids: true
    non_speaker_segment_max_length: ${max_segment_length}
    resources:
      gpus: 0.4
    adapter_kwargs:
      hf_token: ${hf_token}
      max_length: ${max_segment_length}
      segmentation_batch_size: 2
      embedding_batch_size: 2

  # 3. Split long audio segments
  - _target_: nemo_curator.stages.audio.tagging.SplitLongAudioStage
    name: "SplitLongAudio"
    suggested_max_len: ${max_segment_length}
    min_len: 1.0
    resources: ${resources}

  # 4. Word-aligned ASR (NeMo adapter on each split)
  - _target_: nemo_curator.stages.audio.inference.asr.stage.ASRStage
    name: "ASRAlignment"
    adapter_target: nemo_curator.models.asr.nemo_asr.NeMoASRAdapter
    model_id: nvidia/parakeet-tdt_ctc-1.1b
    adapter_kwargs:
      enable_local_attention: true
      decoder_type: ctc
      timestamps: true
    nested_key: split_metadata
    pred_text_key: text
    words_key: alignment
    batch_size: 1
    max_audio_sec_per_actor: 160
    max_inference_duration_s: 160
    resources:
      gpus: 0.45

  # 5. Join split audio metadata
  - _target_: nemo_curator.stages.audio.tagging.JoinSplitAudioMetadataStage
    name: "JoinSplitMetadata"
    resources:
      cpus: 0.5

  # 6. Merge alignment with diarization segments
  - _target_: nemo_curator.stages.audio.tagging.MergeAlignmentDiarizationStage
    name: "MergeAlignmentDiar"
    text_key: "text"
    words_key: "words"
    resources:
      cpus: 0.5

  # 7. Estimate bandwidth
  - _target_: nemo_curator.stages.audio.metrics.bandwidth.BandwidthEstimationStage
    name: "BandwidthEstimation"
    resources: ${resources}

  # 8. Calculate audio quality metrics
  - _target_: nemo_curator.stages.audio.metrics.squim.TorchSquimQualityMetricsStage
    name: "SquimMetrics"
    resources:
      gpus: 0.05


  # 9. Prepare TTS segments
  - _target_: nemo_curator.stages.audio.tagging.PrepareModuleSegmentsStage
    name: "PrepareModuleSegments"
    module: tts
    min_duration: 5
    max_duration: 20
    max_pause: 2
    terminal_punct_marks: ".!?。？！。"
    full_utterance_ratio: 1.0
    punctuation_split_only: false
    resources:
      cpus: 0.5

  # 10. Write output manifest
  - _target_: nemo_curator.stages.audio.common.ManifestWriterStage
    output_path: ${final_manifest}
