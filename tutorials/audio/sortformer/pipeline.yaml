# Minimal whole-recording Sortformer diarization pipeline.
#
# Usage (from the Curator repository root):
#   python nemo_curator/config/run.py \
#     --config-path ../../tutorials/audio/sortformer \
#     manifest_path=tests/fixtures/audio/tagging/sample_input.jsonl

defaults:
  - _self_
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none

hydra:
  run:
    dir: .
  output_subdir: null

manifest_path: ???
output_path: ./sortformer_output.jsonl
model_id: nvidia/diar_streaming_sortformer_4spk-v2.1
gpus_per_actor: 1
batch_size: 4

stages:
  - _target_: nemo_curator.stages.audio.common.ManifestReader
    manifest_path: ${manifest_path}
    files_per_partition: 1

  - _target_: nemo_curator.stages.audio.inference.speaker_diarization.stage.InferenceSortformerStage
    adapter_target: nemo_curator.models.audio.speaker_diarization.sortformer.NeMoSortformerAdapter
    model_id: ${model_id}
    batch_size: ${batch_size}
    resources:
      _target_: nemo_curator.stages.resources.Resources
      gpus: ${gpus_per_actor}
    adapter_kwargs:
      precision: fp32
      chunk_len: 340
      chunk_left_context: 1
      chunk_right_context: 40
      fifo_len: 40
      spkcache_update_period: 300
      spkcache_len: 188
      inference_batch_size: 1

  - _target_: nemo_curator.stages.audio.common.ManifestWriterStage
    output_path: ${output_path}
