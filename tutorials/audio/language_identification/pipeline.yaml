# Speech-language identification with a three-model agreement ensemble.
#
# Usage from the Curator repository root in the tested full-ensemble
# environment documented in README.md:
#   python nemo_curator/config/run.py \
#     --config-path ../../tutorials/audio/language_identification \
#     --config-name pipeline \
#     manifest_path=/absolute/path/to/input.jsonl \
#     output_path=/absolute/path/to/lid_output.jsonl \
#     canary_engine_dir=/absolute/path/to/indic_canary_engine
#
# Every input row must contain an audio_filepath that all executor workers can
# read. The selector copies component evidence into additional_notes, removes
# the intermediate lid mapping, and writes its source_lang decision.

defaults:
  - _self_
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none

hydra:
  run:
    dir: .
  output_subdir: null

manifest_path: ???
output_path: ./audio_lid_output.jsonl
canary_engine_dir: ???

primary_backend: speechbrain
speechbrain_source: speechbrain/lang-id-voxlingua107-ecapa
ambernet_model_name: langid_ambernet
primary_models:
  speechbrain:
    adapter_target: nemo_curator.models.audio.lid.speechbrain.SpeechBrainLIDAdapter
    model_id: SpeechBrainLangID
    adapter_kwargs:
      source: ${speechbrain_source}
  ambernet:
    adapter_target: nemo_curator.models.audio.lid.ambernet.AmberNetLIDAdapter
    model_id: AmberNetLangID
    adapter_kwargs:
      model_name: ${ambernet_model_name}
whisper_model_size: medium
whisper_backend: torch
whisper_tensorrt_engine_path: null
canary_max_duration_sec: 40.0
sample_rate: 16000
batch_size: 16

# Batch-mode Xenna materializes each heavyweight model stage before starting
# the next one. This is the maintained single-GPU topology: the full-GPU
# Canary actor never waits behind resident fractional SpeechBrain/Whisper
# actors. Multi-GPU deployments may opt into Ray Data after sizing the
# aggregate concurrent reservations.
backend: xenna
execution_mode: batch

stages:
  - _target_: nemo_curator.stages.audio.common.ManifestReader
    manifest_path: ${manifest_path}
    files_per_partition: 1

  # Configurable primary classifier. The default is broad-coverage SpeechBrain;
  # set primary_backend=ambernet for NeMo AmberNet.
  - _target_: nemo_curator.stages.audio.inference.lid.stage.AudioLIDInferenceStage
    adapter_target: ${primary_models.${primary_backend}.adapter_target}
    model_id: ${primary_models.${primary_backend}.model_id}
    tag: primary
    name: ${primary_models.${primary_backend}.model_id}
    sample_rate: ${sample_rate}
    waveform_key: null
    sample_rate_key: sample_rate
    audio_filepath_key: audio_filepath
    results_key: lid
    min_duration_sec: 1.0
    max_duration_sec: 10.0
    skip_if_output_exists: true
    fail_on_audio_error: false
    prefetch_fail_on_error: true
    batch_size: ${batch_size}
    num_workers: 2
    resources:
      cpus: 1.0
      gpu_memory_gb: 4.0
    adapter_kwargs: ${primary_models.${primary_backend}.adapter_kwargs}

  # Indic-specialized secondary classifier. The adapter consumes a prebuilt
  # TensorRT-LLM engine; see the README for its required runtime and directory layout.
  - _target_: nemo_curator.stages.audio.inference.lid.stage.AudioLIDInferenceStage
    adapter_target: nemo_curator.models.audio.lid.indic_canary.IndicCanaryLIDAdapter
    model_id: IndicCanaryLangID
    tag: secondary
    name: IndicCanaryLangID
    sample_rate: ${sample_rate}
    waveform_key: null
    sample_rate_key: sample_rate
    audio_filepath_key: audio_filepath
    results_key: lid
    min_duration_sec: 1.0
    max_duration_sec: ${canary_max_duration_sec}
    skip_if_output_exists: true
    fail_on_audio_error: false
    prefetch_fail_on_error: true
    batch_size: ${batch_size}
    num_workers: 1
    resources:
      cpus: 1.0
      gpus: 1.0
    adapter_kwargs:
      engine_dir: ${canary_engine_dir}
      num_beams: 1
      max_new_tokens: 1
      max_duration_sec: ${canary_max_duration_sec}
      kv_cache_free_gpu_memory_fraction: 0.2
      cross_kv_cache_fraction: 0.2

  # Independent tertiary classifier used for English routing and agreement.
  - _target_: nemo_curator.stages.audio.inference.lid.stage.AudioLIDInferenceStage
    adapter_target: nemo_curator.models.audio.lid.whisper.WhisperLIDAdapter
    model_id: WhisperLangID
    tag: tertiary
    name: WhisperLangID
    sample_rate: ${sample_rate}
    waveform_key: null
    sample_rate_key: sample_rate
    audio_filepath_key: audio_filepath
    results_key: lid
    min_duration_sec: 1.0
    max_duration_sec: 30.0
    skip_if_output_exists: true
    fail_on_audio_error: false
    prefetch_fail_on_error: true
    batch_size: ${batch_size}
    num_workers: 2
    resources:
      cpus: 1.0
      gpu_memory_gb: 6.0
    adapter_kwargs:
      model_size: ${whisper_model_size}
      fp16: true
      backend: ${whisper_backend}
      tensorrt_engine_path: ${whisper_tensorrt_engine_path}

  - _target_: nemo_curator.stages.audio.postprocessing.lid_selection.SelectAudioLanguageStage
    results_key: lid
    output_key: source_lang
    confidence_key: source_lid_confidence
    notes_key: additional_notes
    skip_me_key: _skipme

  - _target_: nemo_curator.stages.audio.common.ManifestWriterStage
    output_path: ${output_path}
