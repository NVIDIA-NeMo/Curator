# Hindi Indic ASR benchmark tutorial configuration
#
# The tutorial selects an exact entry from benchmarking/benchmarks.yaml. That
# canonical file remains the single owner of processor arguments, resources,
# timeouts, environment variables, and acceptance requirements.

defaults:
  - _self_
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none

hydra:
  run:
    dir: .
  output_subdir: null

documentation: |
  Hindi Indic Canary + Parakeet recovery benchmark
  ################################################
  Run one canonical benchmark entry over the pinned public Hindi cohort.
  Xenna and Ray Data use the same normalized input, stages, resource contract,
  harness timing boundary, output validator, and correctness requirements.

# Root containing audio_indic_asr_parakeet_hindi_531h_35376a11/manifest.jsonl.
datasets_path: ???

# Root containing both production-compatible engine directories under
# audio_indic_asr/indic_canary_trtllm and audio_indic_asr/parakeet_indic_trt.
model_weights_path: ???

# Root for benchmark session evidence. Use a fresh session_name for every run.
results_path: ./indic_asr_benchmark_output
session_name: indic-asr-${backend}

# Select exactly one canonical benchmark entry per invocation.
backend: xenna

# The full canonical suite config. The tutorial passes a temporary path-only
# overlay after this file and selects the exact Indic ASR entry by name.
benchmark_config: benchmarking/benchmarks.yaml
reason: Indic ASR tutorial exact-entry reproduction
