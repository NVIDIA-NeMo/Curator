defaults:
  - _self_
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none

hydra:
  run:
    dir: .
  output_subdir: null

input_manifest: ???
output_dir: ???
reference_voices_dataset: ???
prompt_file: ???

llm_model: "Qwen/Qwen2.5-7B-Instruct"
llm_max_model_len: 4096
llm_max_tokens: 4096
llm_temperature: 0.7
llm_tensor_parallel_size: 1

language: null
tts_sample_rate: 24000
tts_cfg_weight: 0.5
tts_exaggeration: 0.5
tts_temperature: 0.8

mfa_acoustic_model: "english_us_arpa"
mfa_dictionary: "english_us_arpa"
mfa_g2p_model: "english_us_arpa"
max_pause_duration: 2.0
max_intra_turn_pause: 1.0

# Each phase uses the standard stages:/backend: runner contract. The small
# driver groups completed phase-1 turns into TaskGroup objects before phase 2;
# it does not call any stage lifecycle or processing method directly.
phase1:
  backend: ray_data
  stages:
    - _target_: nemo_curator.stages.audio.common.ManifestReader
      manifest_path: ${input_manifest}
      files_per_partition: 1

    - _target_: nemo_curator.stages.audio.llm.vllm_inference.vLLMInference
      prompt_file: ${prompt_file}
      model:
        model: ${llm_model}
        max_model_len: ${llm_max_model_len}
        max_tokens: ${llm_max_tokens}
        temperature: ${llm_temperature}
        tensor_parallel_size: ${llm_tensor_parallel_size}

    - _target_: nemo_curator.stages.audio.tts.chatterbox_tts.ChatterboxTTSStage
      output_audio_dir: ${output_dir}/audio
      reference_voices_dataset: ${reference_voices_dataset}
      language: ${language}
      sample_rate: ${tts_sample_rate}
      cfg_weight: ${tts_cfg_weight}
      exaggeration: ${tts_exaggeration}
      temperature: ${tts_temperature}

    - _target_: nemo_curator.stages.audio.alignment.mfa_alignment.MFAAlignmentStage
      output_dir: ${output_dir}/alignment
      acoustic_model: ${mfa_acoustic_model}
      dictionary: ${mfa_dictionary}
      g2p_model: ${mfa_g2p_model}
      text_key: utterance
      create_rttm: true
      create_ctm: true

phase2:
  backend: ray_data
  stages:
    - _target_: nemo_curator.stages.audio.merging.merge_conversation.MergeConversationSDPStage
      output_conversations_dir: ${output_dir}/conversations
      max_pause_duration: ${max_pause_duration}
      max_intra_turn_pause: ${max_intra_turn_pause}
      sample_rate: ${tts_sample_rate}

    - _target_: nemo_curator.stages.audio.common.ManifestWriterStage
      output_path: ${output_dir}/merged_manifest.jsonl
