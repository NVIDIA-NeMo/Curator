name: PnCRestoration
text_key: ${text_key}
output_text_key: pnc_text
validation_mode: itn
min_word_retention_ratio: 0.3
generation_config:
  max_tokens: 512
  temperature: 0.0
  top_p: 1.0
  seed: 0
  extra_kwargs:
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
language_rules: null
prompt: |-
  Add punctuation and capitalization to the raw ASR transcription in {language} below. That is the ONLY change you are allowed to make.
  Raw ASR transcription in {language}:
  {text}

  RULES:
  - Add periods, commas, question marks, exclamation marks where appropriate.
  - Capitalize sentence starts and proper nouns only.
  - Every single word from the input MUST appear in the output, unchanged and in the same order. Do not remove, add, replace, or reorder any words or characters.

  Return ONLY the punctuated and capitalized transcription. No explanations.
