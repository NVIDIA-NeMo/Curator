text_key: ${text_key}
output_text_key: pnc_text
validation_mode: itn
min_word_retention_ratio: 0.3
generation_config:
  max_tokens: 512
  temperature: 0.0
  top_p: 1.0
  seed: 0
  extra_kwargs:
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
