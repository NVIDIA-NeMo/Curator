defaults:
  - reference
  - _self_

# Existing serving options; GPU tuning is pending.
model:
  runtime_env:
    env_vars:
      VLLM_CACHE_ROOT: ${cache_root}/vllm
      TORCHINDUCTOR_CACHE_DIR: ${cache_root}/torchinductor
      TRITON_CACHE_DIR: ${cache_root}/triton
  engine_kwargs:
    revision: d4ab4f579dd3516f97d8a6a4c98d0653480bad15  # pragma: allowlist secret - public model revision
    enable_prefix_caching: true
    enable_chunked_prefill: true
    async_scheduling: false
    enforce_eager: false
    compilation_config:
      cache_dir: ${cache_root}/vllm/compile
