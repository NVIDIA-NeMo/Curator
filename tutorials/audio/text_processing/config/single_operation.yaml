defaults:
  - operation: pnc
  - _self_
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none

hydra:
  run:
    dir: .
  output_subdir: null

manifest_path: ???
output_path: ???
text_key: text
language_key: source_lang
ground_truth_key: granary_v1_prediction

backend: ray_data
execution_mode: streaming
batch_size: 64
max_concurrent_requests: 16
request_timeout_s: 120
max_retries: 3

# Set endpoint to an existing OpenAI-compatible /v1 URL to skip server startup.
endpoint: null
model_identifier: Qwen/Qwen3.5-35B-A3B-FP8
model_name: ${model_identifier}

ray_client:
  _target_: nemo_curator.core.client.RayClient

inference_server:
  _target_: nemo_curator.core.serve.InferenceServer
  _convert_: all
  name: audio_text_processing
  health_check_timeout_s: 600
  models:
    - _target_: nemo_curator.core.serve.DynamoVLLMModelConfig
      model_identifier: ${model_identifier}
      model_name: ${model_name}
      num_replicas: 1
      engine_kwargs:
        tensor_parallel_size: 1
        max_model_len: 4096
        gpu_memory_utilization: 0.9
        enable_prefix_caching: true
  backend:
    _target_: nemo_curator.core.serve.DynamoServerConfig

stages:
  - _target_: nemo_curator.stages.audio.ManifestReader
    manifest_path: ${manifest_path}

  - _target_: nemo_curator.stages.audio.text_filtering.AudioTextLLMStage
    _convert_: all
    name: ${operation.name}
    mode: ${oc.select:operation.mode,text}
    user_prompt: ${oc.select:operation.user_prompt,null}
    ground_truth_key: ${ground_truth_key}
    endpoint: ${endpoint}
    model_name: ${model_name}
    prompt: ${operation.prompt}
    text_key: ${operation.text_key}
    output_text_key: ${operation.output_text_key}
    language_key: ${language_key}
    language_rules: ${operation.language_rules}
    validation_mode: ${operation.validation_mode}
    min_word_retention_ratio: ${operation.min_word_retention_ratio}
    generation_config: ${operation.generation_config}
    batch_size: ${batch_size}
    max_concurrent_requests: ${max_concurrent_requests}
    request_timeout_s: ${request_timeout_s}
    max_retries: ${max_retries}

  - _target_: nemo_curator.stages.audio.ManifestWriterStage
    output_path: ${output_path}
