# English audio transcript processing; run with nemo_curator/config/run.py.
defaults:
  - _self_
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none

hydra:
  run:
    dir: .
  output_subdir: null

documentation: |
  Refine existing English audio transcripts without loading audio files. Every
  stage reads and preserves AudioTask records: recover entities, restore
  punctuation/capitalization, verify language, normalize text, generate three
  independent text features together, restore written forms, and remove
  disfluencies. The final manifest retains all input fields and records each
  operation's outcome in additional_notes.

manifest_path: ???
output_path: ???
endpoint: ???
text_key: abbreviated_text
ground_truth_key: text
language_key: source_lang

backend: ray_data
execution_mode: streaming
batch_size: 128
num_workers: 12
max_concurrent_requests: 256
request_timeout_s: 600
max_retries: 3

model_identifier: RedHatAI/gemma-4-31B-it-FP8-dynamic
model_name: ${model_identifier}

# Required only when starting the configured server; keep caches runtime/GPU-specific.
cache_root: ???

ray_client:
  _target_: nemo_curator.core.client.RayClient
  num_gpus: 0

# Start this server separately with the existing InferenceServer API; see README.md.
inference_server:
  _target_: nemo_curator.core.serve.InferenceServer
  _convert_: all
  name: audio_text_processing
  health_check_timeout_s: 1200
  models:
    - _target_: nemo_curator.core.serve.DynamoVLLMModelConfig
      _convert_: all
      model_identifier: ${model_identifier}
      model_name: ${model_name}
      num_replicas: 4
      runtime_env:
        uv:
          packages:
            - transformers==5.8.0
        env_vars:
          VLLM_USE_DEEP_GEMM: "0"
          VLLM_CACHE_ROOT: ${cache_root}/vllm
          TORCHINDUCTOR_CACHE_DIR: ${cache_root}/torchinductor
          TRITON_CACHE_DIR: ${cache_root}/triton
      engine_kwargs:
        tensor_parallel_size: 2
        max_model_len: 8192
        gpu_memory_utilization: 0.95
        kv_cache_dtype: auto
        max_num_seqs: 256
        max_num_batched_tokens: 8192
        language_model_only: true
        trust_remote_code: true
        revision: d4ab4f579dd3516f97d8a6a4c98d0653480bad15  # pragma: allowlist secret - public model revision
        enable_prefix_caching: true
        enable_chunked_prefill: true
        async_scheduling: false
        enforce_eager: false
        compilation_config:
          cache_dir: ${cache_root}/vllm/compile
  backend:
    _target_: nemo_curator.core.serve.DynamoServerConfig

stages:
  # 1. Read the audio manifest.
  - _target_: nemo_curator.stages.audio.ManifestReader
    manifest_path: ${manifest_path}

  # 2. Recover named entities.
  - _target_: nemo_curator.stages.audio.text_filtering.AudioTextLLMStage
    _convert_: all
    endpoint: ${endpoint}
    model_name: ${model_name}
    language_key: ${language_key}
    batch_size: ${batch_size}
    num_workers_override: ${num_workers}
    max_concurrent_requests: ${max_concurrent_requests}
    request_timeout_s: ${request_timeout_s}
    max_retries: ${max_retries}
    name: RecoverEntities
    prompt: "You are given TWO transcriptions of the same audio clip:\n\n- INITIAL: Initial reference with named entity spelling/casing.\n\
      - NORMALIZED: Normalized transcription.\n\nYour task:\n\n1. In the INITIAL text, identify ONLY proper-noun named entities\
      \ made of letters/words only (no digits): people, places, organizations, companies, products, brands, and acronyms/initialisms.\
      \ \n\n2. If a candidate contains any digit (0-9), it is NOT an entity and must be excluded.\n\n3. Titles/honorifics\
      \ are NOT entities and must be excluded.\n\n4. For each remaining entity, locate its match in the NORMALIZED text and\
      \ substitute it with the INITIAL spelling/casing. Change ONLY the entity itself — leave all normalization untouched:\
      \ keep numbers, dates, times, money, units, and titles in their written form.\n\n\nReturn ONLY the resulting NORMALIZED\
      \ text. No explanations, labels, or extra formatting."
    text_key: ${text_key}
    output_text_key: entity_recovered_text
    validation_mode: none
    min_word_retention_ratio: 0.3
    generation_config:
      max_tokens: 1024
      temperature: 0.0
      top_p: 1.0
      seed: 0
      extra_kwargs:
        extra_body:
          chat_template_kwargs:
            enable_thinking: false
    mode: recover_entities
    user_prompt: |-
      INITIAL:
      "{ground_truth}"

      NORMALIZED:
      "{normalized}"
    ground_truth_key: ${ground_truth_key}

  # 3. Restore punctuation and capitalization.
  - _target_: nemo_curator.stages.audio.text_filtering.AudioTextLLMStage
    _convert_: all
    endpoint: ${endpoint}
    model_name: ${model_name}
    language_key: ${language_key}
    batch_size: ${batch_size}
    num_workers_override: ${num_workers}
    max_concurrent_requests: ${max_concurrent_requests}
    request_timeout_s: ${request_timeout_s}
    max_retries: ${max_retries}
    name: PnCRestoration
    prompt: |-
      Add punctuation and capitalization to the raw ASR transcription in {language} below. That is the ONLY change you are allowed to make.
      Raw ASR transcription in {language}:
      {text}

      RULES:
      - Add periods, commas, question marks, exclamation marks where appropriate.
      - Capitalize sentence starts and proper nouns only.
      - Every single word from the input MUST appear in the output, unchanged and in the same order. Do not remove, add, replace, or reorder any words or characters.

      Return ONLY the punctuated and capitalized transcription. No explanations.
    text_key: entity_recovered_text
    output_text_key: pnc_text
    validation_mode: itn
    min_word_retention_ratio: 0.3
    generation_config:
      max_tokens: 512
      temperature: 0.0
      top_p: 1.0
      seed: 0
      extra_kwargs:
        extra_body:
          chat_template_kwargs:
            enable_thinking: false

  # 4. Predict and verify the transcript language.
  - _target_: nemo_curator.stages.audio.text_filtering.AudioTextLLMStage
    _convert_: all
    endpoint: ${endpoint}
    model_name: ${model_name}
    language_key: ${language_key}
    batch_size: ${batch_size}
    num_workers_override: ${num_workers}
    max_concurrent_requests: ${max_concurrent_requests}
    request_timeout_s: ${request_timeout_s}
    max_retries: ${max_retries}
    name: LanguageID
    prompt: |-
      # Language Identification

      You are given a transcript of spoken audio. Your task is to identify the language(s) in which the text is written, including any code-switching.

      Analyze the vocabulary, grammar, script, and word patterns. Spoken audio can be code-switched as well — a speaker may mix two or more languages in a single utterance. Detect this instead of collapsing everything to one label.

      ## Guidelines

      - Identify the PRIMARY language: the one that carries most of the meaningful content.
      - Also list EVERY language present in the transcript, including the primary one.
      - Return full English names of languages (e.g. English, Spanish, French, German, Hindi, Chinese). Do not return ISO codes, locale tags, or abbreviations (e.g. do not return "en", "es", or "fr-FR").
      - Proper nouns and isolated loanwords do NOT count as a separate language; only count a language if it contributes real words or phrases.
      - If only one language is present, list just that one.
      - If the text is too short to identify confidently, choose the most likely language(s) based on the available words and script.

      ## Output format

      Return exactly two lines, nothing else. No explanations, quotes, or extra formatting:

      ```
      Primary: <primary language name>
      Languages: <comma-separated language names, including the primary>
      ```

      ## Examples

      Transcript: "Bonjour, comment allez-vous aujourd'hui?"
      Primary: French
      Languages: French

      Transcript: "El clima está muy agradable esta mañana."
      Primary: Spanish
      Languages: Spanish

      Transcript: "मुझे लगता है कि हमें इस project को कल तक finish कर देना चाहिए।"
      Primary: Hindi
      Languages: Hindi, English

      Transcript: "I think we should schedule the meeting for next Tuesday."
      Primary: English
      Languages: English
    text_key: pnc_text
    output_text_key: llm_language_prediction
    validation_mode: none
    min_word_retention_ratio: 0.3
    generation_config:
      max_tokens: 512
      temperature: 0.0
      top_p: 1.0
      seed: 0
      extra_kwargs:
        extra_body:
          chat_template_kwargs:
            enable_thinking: false
    mode: language_id

  # 5. Normalize written text to spoken form.
  - _target_: nemo_curator.stages.audio.text_filtering.AudioTextLLMStage
    _convert_: all
    endpoint: ${endpoint}
    model_name: ${model_name}
    language_key: ${language_key}
    batch_size: ${batch_size}
    num_workers_override: ${num_workers}
    max_concurrent_requests: ${max_concurrent_requests}
    request_timeout_s: ${request_timeout_s}
    max_retries: ${max_retries}
    name: TextNormalization
    prompt: |-
      # Text Normalization ({language})

      Convert the written-form transcript below in **{language}** to spoken form. **Only** apply conversions from the table (numbers, dates, times, money, units, symbols, etc.). Use **{language}** conventions; English examples show the pattern.

      Return ONLY normalized text. No explanations or extra formatting.

      ## Constraints

      - Stay in **{language}**; preserve code-switching/script mix. Do NOT translate.
      - Do NOT clean up speech: keep fillers (um, uh, …), repetitions, false starts (go- going), colloquial forms (gonna, wanna), grammar errors, and all non-target wording unchanged and in order.
      - Do NOT add or remove words or punctuation except as required by conversions (e.g. `@` → "at" in an email).
      - Denormalize digits/symbols **only** when they match Conversion Rules. Leave idiomatic numbers, proper nouns, vague quantities, disfluencies, and text already spoken as words unchanged (e.g. keep "oh eleven" as-is; do not swap "oh" ↔ "zero" unless denormalizing a digit sequence).
      - In stammers/false starts, denormalize only the final clean numeric token.

      ## Conversion Rules

      | Category | Written | Spoken |
      |---|---|---|
      | Cardinal | 14 / 1,030.5 / 2024 | fourteen / one thousand thirty point five / twenty twenty four |
      | Ordinal | 1st / 21st / 50th | first / twenty first / fiftieth |
      | Date | January 22nd, 1847 / January 22, 1990 | january twenty second eighteen forty seven / january twenty two nineteen ninety |
      | Time | 3:05 PM / 10 AM / 1:45 / noon | three o five PM / ten AM / one forty five / noon |
      | Money | $52 / $249.99 | fifty two dollars / two hundred forty nine dollars and ninety nine cents |
      | Percent | 0.5% / 20% to 30% | zero point five percent / twenty to thirty percent |
      | Units | 5 kg / 90 km/h / 5'4" | five kilograms / ninety kilometers per hour / five foot four |
      | Fractions | 1/2 / 1/3 / 2/3 / 1 3/4 | half / a third / two thirds / one and three quarters |
      | Phone | 5558675309 / 18005550199 | five five five eight six seven five three zero nine / one eight hundred five five five oh one nine nine |
      | URL/Email | example.com/pricing / john@gmail.com | example dot com slash pricing / john at gmail dot com |
      | Titles | Dr. Smith / Prof. Jones / vs. / w/o | doctor smith / professor jones / versus / without |
      | Address | 450 N. Main St. | four fifty north main street |
      | Roman num. | King Henry VIII / Chapter IV | king henry the eighth / chapter four |
      | Negative | -12 / -5 degrees | negative twelve / minus five degrees |
      | Decades | 70s / 20s | seventies / twenties |
      | Letter+num | Q2 / B12 | q two / b twelve |

      Additional rules:
      - Structural symbols (`.`, `@`, `/`, `:`, `-`) → spoken words in URLs, emails, phones, using **{language}** forms ("dot", "at", "slash", …).
      - Acronyms (NASA, FBI, AM, PM): keep natural spoken form; do not expand unrelated abbreviations.
      - Phone/time "0" → "oh" or "zero" per **{language}**; zip/house numbers → digit-by-digit when denormalizing.

      ## Ambiguity

      - Denormalize digit/symbol form for quantities, measurements, ages, dates, and counts.
      - Skip idioms, proper nouns ("One Direction"), vague quantities, temporal "quarter", and idiomatic "half".
      - Convert 1/2 or 1/4 to "half" / "a quarter" only for true fractions.

      Written-form transcript in {language}:
      {text}
    text_key: pnc_text
    output_text_key: tn_raw
    validation_mode: none
    min_word_retention_ratio: 0.3
    generation_config:
      max_tokens: 512
      temperature: 0.0
      top_p: 1.0
      seed: 0
      extra_kwargs:
        extra_body:
          chat_template_kwargs:
            enable_thinking: false

  # 6. Run captioning, code switching, and speech QA concurrently.
  - _target_: nemo_curator.stages.audio.text_filtering.AudioTextLLMStage
    _convert_: all
    endpoint: ${endpoint}
    model_name: ${model_name}
    language_key: ${language_key}
    batch_size: ${batch_size}
    num_workers_override: ${num_workers}
    max_concurrent_requests: ${max_concurrent_requests}
    request_timeout_s: ${request_timeout_s}
    max_retries: ${max_retries}
    name: FusedTextLLM
    operations:
      - name: Captioning
        text_key: tn_raw
        output_text_key: captioning_text
        validation_mode: none
        min_word_retention_ratio: 0.3
        generation_config:
          max_tokens: 512
          temperature: 0.0
          top_p: 1.0
          seed: 0
          extra_kwargs:
            extra_body:
              chat_template_kwargs:
                enable_thinking: false
        language_rules: null
        prompt: |-
          # Audio Caption Generation

          You are given a transcript of spoken audio. Generate a short, descriptive caption that summarizes what is being said.

          Return ONLY the caption. No explanations, labels, quotes, or extra formatting.

          ## Guidelines

          - Write a concise summary (1-2 sentences) of the main topic or content
          - Use third person (e.g. "A speaker discusses..." or "The conversation covers...")
          - Capture the key subject matter, not every detail
          - Keep it factual — do not add opinions or interpretations
          - If the transcript is too short or unclear, describe what little content there is
          - PRESERVE the language of the input — if the transcript is in Spanish, write the caption in Spanish

          ## Examples

          Transcript: "So today we're going to talk about how photosynthesis works in plants. The basic idea is that plants convert sunlight into chemical energy."
          Caption: A speaker explains how photosynthesis works, describing how plants convert sunlight into chemical energy.

          Transcript: "The stock market dropped three percent yesterday following the Federal Reserve's announcement about interest rates."
          Caption: A news report about a stock market decline following a Federal Reserve interest rate announcement.

          Transcript: "First you need to preheat the oven to three fifty. Then mix the flour and sugar together in a large bowl."
          Caption: Instructions for a baking recipe, including oven temperature and mixing dry ingredients.
      - name: CodeSwitching
        text_key: tn_raw
        output_text_key: code_switched_text
        validation_mode: none
        min_word_retention_ratio: 0.3
        generation_config:
          max_tokens: 512
          temperature: 0.0
          top_p: 1.0
          seed: 0
          extra_kwargs:
            extra_body:
              chat_template_kwargs:
                enable_thinking: false
        language_rules: null
        prompt: |-
          You are a {language} language expert. Your task is to restore code-switching in a {language} transcript: whenever a word in the transcript is actually an English word that was written phonetically in {language} script, rewrite it using its original English (Latin) spelling.

          Context: the input transcript was produced by a human transcriber who wrote everything in {language} script, including English words the speaker actually pronounced in English. We want the transcript to reflect the real code-switched utterance: {language} words stay in {language} script, English words appear in Latin script.

          You are performing transliteration RESTORATION, NOT translation. This distinction is the entire task.

          THE PHONETIC TEST (apply to every single word):
          For each word written in {language} script, ask whether pronouncing it with {language} phonology makes it sound like an English word with the same meaning.
          - If YES, the word is an English word spelled phonetically in {language} script. Restore its standard English Latin spelling.
          - If NO, the word is a native {language} word. LEAVE IT EXACTLY AS WRITTEN. Do not translate it, even if you know what it means in English.

          The phonetic test is about sound, not meaning. A {language}-native word can mean the same thing as an English word and still be native. Native vocabulary in any language has its own phonology that does not echo English. Loanwords inherit English phonemes that show through the transliteration.

          WHEN IN DOUBT, LEAVE THE WORD UNCHANGED. Under-restoration is acceptable; over-translation is not. If you cannot clearly hear the English pronunciation in the {language}-script word, treat it as native.

          Categories that ARE typically active English code-switches (restore to English):
          - Modern technical, software, user-interface, scientific, medical, chemical, and business terms when they are clearly being pronounced as English
          - Brand names, company names, product names
          - Person names of non-{language} origin, place names of non-{language} origin
          - Acronyms and abbreviations
          - Recently borrowed concepts that are not naturally established as native-script vocabulary in {language}

          Categories that are typically NATIVE or established loanwords (leave unchanged):
          - Everyday objects, common materials, basic concepts, body parts, family terms
          - Native flora, fauna, foods, cultural/religious terms
          - Place names native to the {language}'s region
          - Words for which the {language} has used its own term for centuries
          - Established loanwords that have a conventional native-script form and function naturally as part of {language} vocabulary or morphology

          Grammatical rules:
          1. If a restored English root carries a {language} grammatical suffix, case marker, postposition, or combining mark, output the English root in standard Latin spelling and keep the suffix in original {language} script, separated by exactly one space.
          2. A whitespace-delimited token must never contain both Latin and native-script characters. If a suffix cannot be isolated safely, keep the complete original native-script token unchanged.
          3. Preserve original word order, punctuation, repetitions, and sentence structure exactly. Do not paraphrase, summarize, translate, or reorder.
          4. If the input contains no English-origin transliterated words, return it unchanged.
          5. Output ONLY the rewritten {language} text. No explanations, no quotation marks around the output, no commentary.

          ADDITIONAL OUTPUT RULES — these rules take precedence over any conflicting formatting rule above:
          - Never output numeric digits in any script. Preserve spoken numbers as words. Restore phonetically English number words as English words. Never translate native-language number words into English.
          - Restore clear short English discourse words such as so, yes, yeah, no, okay, hi, hello, please, sorry, and thanks, including at utterance boundaries. Handle repeated occurrences consistently.
          - Keep an established loanword in native script when it has a conventional native-script form and functions naturally as part of {language}; otherwise, restore a clear phonetic rendering of an active English word to standard Latin spelling.
          - Restore clearly active English technical, software, user-interface, scientific, and business terms to Latin script, while leaving genuine native-language equivalents and established native-script loanwords unchanged.
          - For any already mixed Latin plus native-script token, separate the Latin English stem from the native-script suffix with exactly one space. Do not use this rule to manufacture a Latin stem from a valid fully native-script loanword.
          - Use only Latin script for restored English and the standard native script of {language} for non-English text. Never introduce characters from any other script.

          FINAL NON-NEGOTIABLE CHECKS:
          - The output must contain no digit characters zero through nine, even when a digit was already present in the input or belongs to an acronym, model, product, size, version, chemical formula, or proper name. Rewrite each digit as an English number word while preserving surrounding letters. Schematic examples: H1 -> H one; T20 -> T twenty; 4G -> four G; G20 -> G twenty; 4XL -> four XL; GSTR 3B -> GSTR three B; H2O -> H two O; B2B -> B two B; K2 -> K two; Ben 10 -> Ben ten; 7 AM -> seven AM. Scan once more after writing and replace every remaining digit.
          - A whitespace-delimited output token must never contain both Latin letters and any non-Latin language-script letters or marks. Schematic examples: EnglishRoot<suffix> -> EnglishRoot <suffix>; EnglishAcronym<case-marker> -> EnglishAcronym <case-marker>. If the native suffix is not a real grammatical suffix or cannot be separated confidently, keep the complete token in native script.
          - Preserve the intended English word, not a similar word plus a fabricated suffix. Do not invent native suffixes to explain an English word.
          - Separate only the true native grammatical suffix; do not split inside the native spelling of an established loanword.
          - Before answering, silently scan every output token character by character and verify all three constraints: no digits, no Latin/native mixed-script tokens, and no script other than Latin plus the standard native script of {language}.

          Apply the phonetic test to every word. When in doubt, leave the word unchanged. Now rewrite the following {language} text:
          {text}
      - name: SpeechQA
        text_key: tn_raw
        output_text_key: speech_qa_text
        validation_mode: none
        min_word_retention_ratio: 0.3
        generation_config:
          max_tokens: 512
          temperature: 0.0
          top_p: 1.0
          seed: 0
          extra_kwargs:
            extra_body:
              chat_template_kwargs:
                enable_thinking: false
        language_rules: null
        prompt: |-
          You are given a transcript of a spoken audio segment in {language}. Generate at most one question-answer (Q/A) pair grounded in the transcript content.

          The Q/A pair must be answerable from the transcript alone — no external knowledge, no information that is not stated or directly implied in the transcript. The question and the answer must both be in {language}, the same language as the transcript.

          First decide whether the transcript is suitable for Q/A generation. The transcript is NOT suitable if:
          - It is too short or carries no substantive informational content (a few words, pure filler, disfluencies only, isolated single words).
          - It is a pure conversational utterance with no information content (greetings, farewells, acknowledgments, agreements, fillers like "yeah", "okay", "thanks").

          For everything else (borderline cases, edge cases, content of any genre or style), use your own judgment based on whether a meaningful, well-grounded Q/A pair can plausibly be produced. When borderline, prefer SKIP over generating a weak or hallucinated pair.

          Output format:

          If the transcript IS suitable, output exactly two lines and nothing else:
          Q: <one concrete question in {language}, not yes/no, not a trivial restatement>
          A: <a concise answer in {language}, a phrase or one short sentence, directly supported by the transcript>

          If the transcript is NOT suitable, output exactly the single line:
          SKIP

          Do not output explanations, markdown, code fences, surrounding text, blank lines before, or anything other than the two-line Q/A block or the single word SKIP.

          Transcript:
          {text}

  # 7. Restore written-form numbers, dates, and other expressions.
  - _target_: nemo_curator.stages.audio.text_filtering.AudioTextLLMStage
    _convert_: all
    endpoint: ${endpoint}
    model_name: ${model_name}
    language_key: ${language_key}
    batch_size: ${batch_size}
    num_workers_override: ${num_workers}
    max_concurrent_requests: ${max_concurrent_requests}
    request_timeout_s: ${request_timeout_s}
    max_retries: ${max_retries}
    name: ITNRestoration
    prompt: |-
      # Inverse Text Normalization

      Convert spoken-form text to standard written form: numbers, dates, times, currencies, measurements, and symbols become their conventional written representations.

      Return ONLY the converted text. No explanations, labels, or extra formatting.

      ## Constraints

      - PRESERVE the input language. Do NOT translate.
      - PRESERVE all original wording, disfluencies (um, uh, euh, ähm), repetitions, false starts (go- going), colloquial forms (gonna, 'cause), mispronunciations, and grammatical errors.
      - Do NOT add punctuation that wasn't implied by the input.
      - Do NOT paraphrase, add, or remove words beyond the conversions below.
      - When a number word is idiomatic (not numeric), keep it as a word (see Ambiguity Resolution).

      ## Conversion Rules

      | Category | Spoken | Written |
      |---|---|---|
      | Cardinal | fourteen / one thousand thirty point five / twenty twenty four | 14 / 1,030.5 / 2024 |
      | Ordinal | first / twenty first / fiftieth | 1st / 21st / 50th |
      | Date | january twenty second eighteen forty seven / january twenty two nineteen ninety | January 22nd, 1847 / January 22, 1990 |
      | Time | three o five PM / ten AM / one forty five / noon | 3:05 PM / 10 AM / 1:45 / noon |
      | Money | fifty two dollars / two hundred forty nine dollars and ninety nine cents | $52 / $249.99 |
      | Percent | zero point five percent / twenty to thirty percent | 0.5% / 20% to 30% |
      | Units | five kilograms / ninety kilometers per hour / five foot four | 5 kg / 90 km/h / 5'4" |
      | Fractions | half / a third / two thirds / one and three quarters | 1/2 / 1/3 / 2/3 / 1 3/4 |
      | Phone | five five five eight six seven five three zero nine / one eight hundred five five five oh one nine nine | 5558675309 / 18005550199 |
      | URL/Email | example dot com slash pricing / john at gmail dot com | example.com/pricing / john@gmail.com |
      | Titles | doctor smith / professor jones / versus / without | Dr. Smith / Prof. Jones / vs. / w/o |
      | Address | four fifty north main street | 450 N. Main St. |
      | Roman num. | king henry the eighth / chapter four | King Henry VIII / Chapter IV |
      | Negative | negative twelve / minus five degrees | -12 / -5 degrees |
      | Decades | seventies / twenties | 70s / 20s |
      | Letter+num | q two / b twelve | Q2 / B12 |

      Additional rules:
      - Symbols: "dot"→".", "at"→"@", "slash"→"/", "colon"→":", "dash"→"-".
      - Acronyms (NASA, FBI, SQL, AM, PM): keep uppercase as-is.
      - "zero" → "0"; "oh"/"o" in phone/time contexts → "0".
      - Zip codes: spell digit by digit. House numbers: digits.

      ## Ambiguity Resolution

      - Prefer digits for quantities, measurements, ages, dates, counts.
      - Keep as WORDS for idioms, proper nouns, and pronominal/indefinite uses:
        - "one of the best", "the only one", "one another", "one by one"
        - "One Direction" (proper noun), "a couple of things" (vague quantity)
      - "quarter" in temporal/financial contexts stays as "quarter" ("fourth quarter", "quarter over quarter"). Only convert to 1/4 when it's a true fraction ("a quarter of a cup" → "1/4 of a cup").
      - "half" → 1/2 only as a fraction; idiomatic use stays a word ("half the time", "half asleep").
      - In stammers/false starts, keep number words as words: "o- o- one hundred" → "o- o- 100" (digits only on the final clean token).
    text_key: tn_raw
    output_text_key: itn_raw
    validation_mode: itn
    min_word_retention_ratio: 0.3
    generation_config:
      max_tokens: 512
      temperature: 0.0
      top_p: 1.0
      seed: 0
      extra_kwargs:
        extra_body:
          chat_template_kwargs:
            enable_thinking: false

  # 8. Remove disfluencies.
  - _target_: nemo_curator.stages.audio.text_filtering.AudioTextLLMStage
    _convert_: all
    endpoint: ${endpoint}
    model_name: ${model_name}
    language_key: ${language_key}
    batch_size: ${batch_size}
    num_workers_override: ${num_workers}
    max_concurrent_requests: ${max_concurrent_requests}
    request_timeout_s: ${request_timeout_s}
    max_retries: ${max_retries}
    name: DisfluencyRemoval
    prompt: |-
      # Disfluency Removal

      Remove speech disfluencies from the following text. Do NOT change anything else.

      Return ONLY the cleaned text. No explanations, labels, or extra formatting.

      ## What to Remove

      - **Filler words**: "um", "uh", "hm", "ah", "er", "eh", "like" (when used as filler), "you know" (when used as filler)
      - **Repeated words**: "I I think" → "I think", "the the problem" → "the problem"
      - **False starts**: incomplete words the speaker abandoned, e.g. "I was go- going to" → "I was going to"

      ## What to Keep — Do NOT Change

      - All numbers, dates, symbols, abbreviations — leave exactly as they are
      - Punctuation and capitalization — leave exactly as they are
      - Colloquial forms ("gonna", "wanna", "'cause") — keep as-is
      - Grammar — do NOT correct grammatical errors
      - Content words — do NOT rephrase or paraphrase
      - The language — do NOT translate

      The ONLY change you should make is removing filler words, repeated words, and false starts. Everything else must remain identical.
    text_key: itn_raw
    output_text_key: itn_clean
    validation_mode: itn
    min_word_retention_ratio: 0.5
    generation_config:
      max_tokens: 512
      temperature: 0.0
      top_p: 1.0
      seed: 0
      extra_kwargs:
        extra_body:
          chat_template_kwargs:
            enable_thinking: false

  # 9. Write the enriched audio manifest.
  - _target_: nemo_curator.stages.audio.ManifestWriterStage
    output_path: ${output_path}
