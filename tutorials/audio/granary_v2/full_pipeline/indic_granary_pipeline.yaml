# Indic recording-to-transcript pipeline; see README.md. Run with: main.py -cn indic_granary_pipeline
defaults:
  - common
  - prompts
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

documentation: |
  Extract metadata and Opus speech clips from recordings (language ID: SpeechBrain
  + Indic Canary + Whisper), keep clips in 22 Indic languages, transcribe with Indic
  Canary (TensorRT-LLM) and Parakeet-Riva / IndicConformer recovery, then enrich the
  selected text.
  clips.jsonl holds the Opus clips with their ASR result, before text enrichment;
  indic.jsonl contains the selected clips with ASR and text features.

output_path: ${output_dir}/indic.jsonl
regex_yaml: tutorials/audio/granary_v2/indic_asr/regex.yaml

stages:
  - ${shared.manifest_reader}
  - ${shared.resample_audio_stage}
  - ${shared.mono_conversion_stage}
  - ${shared.inference_sortformer_stage}
  - ${shared.v_a_d_segmentation_stage}
  - ${shared.s_e_d_inference_stage}
  - ${shared.s_e_d_postprocessing_stage}
  - ${shared.speech_brain_lang_i_d}

  - _target_: nemo_curator.stages.audio.inference.lid.AudioLIDInferenceStage
    name: IndicCanaryLangID
    adapter_target: nemo_curator.models.audio.lid.indic_canary.IndicCanaryLIDAdapter
    model_id: IndicCanaryLangID
    tag: secondary
    waveform_key: waveform
    min_duration_sec: 1
    max_duration_sec: 40
    batch_size: 16
    num_workers_override: 1
    fail_on_audio_error: true
    adapter_kwargs:
      engine_dir: ${model_dir}/indic_canary
      num_beams: 1
      max_new_tokens: 1
      model_batch_size: 16
      min_duration_sec: 1
      max_duration_sec: 40
      kv_cache_free_gpu_memory_fraction: 0.1
      cross_kv_cache_fraction: 0.1
    resources:
      gpu_memory_gb: 8

  - _target_: nemo_curator.stages.audio.inference.lid.AudioLIDInferenceStage
    name: WhisperLangID
    adapter_target: nemo_curator.models.audio.lid.whisper.WhisperLIDAdapter
    model_id: WhisperLangID
    tag: tertiary
    waveform_key: waveform
    min_duration_sec: 1
    max_duration_sec: 30
    batch_size: 16
    num_workers_override: 2
    fail_on_audio_error: true
    adapter_kwargs:
      model_size: medium
      model_path: ${model_dir}/whisper.pt
      backend: torch
      fp16: true
      model_batch_size: 16
    resources:
      gpu_memory_gb: 8
  - ${shared.select_audio_language_stage}

  # Only clips in the 22 Indic languages below reach ASR.
  - _target_: nemo_curator.stages.audio.common.PreserveByValueConditionsStage
    _convert_: all
    conditions:
      - {input_value_key: source_lang, target_value: as, operator: eq}
      - {input_value_key: source_lang, target_value: bn, operator: eq}
      - {input_value_key: source_lang, target_value: brx, operator: eq}
      - {input_value_key: source_lang, target_value: doi, operator: eq}
      - {input_value_key: source_lang, target_value: gu, operator: eq}
      - {input_value_key: source_lang, target_value: hi, operator: eq}
      - {input_value_key: source_lang, target_value: kn, operator: eq}
      - {input_value_key: source_lang, target_value: kok, operator: eq}
      - {input_value_key: source_lang, target_value: ks, operator: eq}
      - {input_value_key: source_lang, target_value: mai, operator: eq}
      - {input_value_key: source_lang, target_value: ml, operator: eq}
      - {input_value_key: source_lang, target_value: mni, operator: eq}
      - {input_value_key: source_lang, target_value: mr, operator: eq}
      - {input_value_key: source_lang, target_value: ne, operator: eq}
      - {input_value_key: source_lang, target_value: or, operator: eq}
      - {input_value_key: source_lang, target_value: pa, operator: eq}
      - {input_value_key: source_lang, target_value: sa, operator: eq}
      - {input_value_key: source_lang, target_value: sat, operator: eq}
      - {input_value_key: source_lang, target_value: sd, operator: eq}
      - {input_value_key: source_lang, target_value: ta, operator: eq}
      - {input_value_key: source_lang, target_value: te, operator: eq}
      - {input_value_key: source_lang, target_value: ur, operator: eq}
    condition_logic: or
    missing_value_policy: drop

  - _target_: nemo_curator.stages.audio.inference.indic_canary.InferenceIndicCanaryStage
    keep_waveform: true
    name: IndicCanary_primary
    engine_dir: ${model_dir}/indic_canary
    num_beams: 4
    max_new_tokens: 347
    pnc: false
    kv_cache_free_gpu_memory_fraction: 0.1
    cross_kv_cache_fraction: 0.1
    sample_rate_key: sample_rate
    pred_text_key: primary_model_prediction
    batch_size: 64
    num_workers_override: 4
    resources:
      _target_: nemo_curator.stages.resources.Resources
      gpu_memory_gb: 50
  - ${shared.whisper_hallucination_primary}

  - _target_: nemo_curator.stages.audio.inference.asr.stage.ASRStage
    waveform_key: waveform
    sample_rate_key: sample_rate
    keep_waveform: true
    name: ParakeetRiva_recovery
    run_only_if_hallucinated: ${recovery_only_if_hallucinated}
    skip_if_output_exists: true
    adapter_target: nemo_curator.models.asr.indic_parakeet_rnnt_tensorrt.TensorRTParakeetRNNTAdapter
    supported_language_codes: [hi]
    unsupported_language_marks_skip: false
    preserve_existing_skip: true
    max_audio_sec_per_actor: 2400.0
    pred_text_key: fallback_model_prediction
    model_id: ${model_dir}/indic_parakeet/model.nemo
    batch_size: 64
    num_workers_override: 4
    adapter_kwargs:
      engine_dir: ${model_dir}/indic_parakeet
      chunking_mode: engine
      empty_audio_marks_skip: false
    resources:
      _target_: nemo_curator.stages.resources.Resources
      gpu_memory_gb: 24

  - _target_: nemo_curator.stages.audio.inference.asr.stage.ASRStage
    waveform_key: waveform
    sample_rate_key: sample_rate
    keep_waveform: true
    name: IndicConformer_recovery
    run_only_if_hallucinated: ${recovery_only_if_hallucinated}
    skip_if_output_exists: true
    adapter_target: nemo_curator.models.audio.indic_conformer_hybrid.IndicConformerHybridASR
    supported_language_codes: [as, bn, brx, doi, gu, kn, kok, ks, mai, ml, mni, mr, ne, or, pa, sa, sat, sd, ta, te, ur]
    unsupported_language_marks_skip: false
    preserve_existing_skip: true
    max_audio_sec_per_actor: 2400.0
    pred_text_key: fallback_model_prediction
    model_id: ai4bharat/indicconformer_stt_hi_hybrid_ctc_rnnt_large
    batch_size: 64
    adapter_kwargs:
      decode_mode: rnnt
      rnnt_precision: fp32
      empty_audio_marks_skip: false
    resources:
      _target_: nemo_curator.stages.resources.Resources
      gpu_memory_gb: 16
  - ${shared.whisper_hallucination_asr}

  - _target_: nemo_curator.stages.audio.text_filtering.SelectBestPredictionStage
    primary_text_key: primary_model_prediction
    fallback_text_key: fallback_model_prediction
    reference_text_key: null
    use_reference_on_hallucination: false
    use_ground_truth_for_short_audio: false
    output_key: best_prediction
    primary_model_type: indic_canary
  - ${shared.audio_segment_writer_stage}
  - ${shared.clip_manifest_writer}
  - ${shared.regex_substitution_stage}
  - ${shared.abbreviation_concat_stage}
  - ${shared.recover_entities}
  - ${shared.pn_c_restoration}
  - ${shared.language_i_d}
  - ${shared.text_normalization}
  - ${shared.fused_text_l_l_m}
  - ${shared.i_t_n_restoration}
  - ${shared.disfluency_removal}
  - ${shared.manifest_writer_stage}
