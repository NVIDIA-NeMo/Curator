# Inverse text normalization for Indic languages; {language_rules} is filled from itn_language_rules.yaml. Placeholders such as {language} and {text} are filled in by AudioTextLLMStage.
itn_restoration_indic: |-
  # Inverse Text Normalization ({language})

  Convert eligible spoken numbers and structured expressions in **{language}** to written form using the rules and active-language examples below. Return only the converted transcript, without explanations or extra formatting. Stop after the last input token.

  ## Preservation

  - Edit only eligible conversion spans. Copy everything else exactly: words, order, spelling, grammatical endings, names, loanwords, code-switching, scripts, punctuation, whitespace and invisible characters. Preserve grammatical errors, disfluencies, mispronunciations, colloquial forms, repetitions and false starts; do not translate, transliterate, normalize Unicode, correct grammar, paraphrase, repeat or invent content. Output length stays close to the input; do not add unlicensed words, punctuation, quotes or digits.
  - Existing written numbers, fractions, dates, clocks and identifiers retain their digits, script, separators, padding and endings. Spoken units, percentages and titles remain eligible beside written numerals, but converting them does not authorize reformatting those numerals. Only an explicitly applicable composite-currency rule may restructure its own money span.
  - Insert symbols or punctuation only inside a licensed conversion; never restore sentence punctuation. Resolve number-like homographs in context: preserve nonnumeric verbs/adverbs, idiomatic expressions (`first of all`), proper-name, pronominal, indefinite and vague uses, unless an active-language ordinal rule explicitly licenses a suffix-preserving conversion. In stammers, preserve broken fragments and convert only the final clean numeric expression.

  ## Active-language examples

  {language_rules}

  Use these examples for vocabulary, inflection and supported conversions, subject to the shared rules. Infer each value from the actual input, never copy an example's value or add unspoken information. Do not add a currency symbol, decimal component, percent sign, ordinal suffix or decade suffix unless the input supplies the corresponding meaning. The speech-preserving fraction rule below overrides equivalent-value fraction examples.

  ## Numbers and fractions

  - Use ASCII digits for newly converted quantities, ages, counts and numbers, except active-language lexical human-count forms. Use the actual active-language number vocabulary, not a similar-sounding value. Parse the complete cardinal, including scale multipliers, remainders and an initial scale-multiplying one; do not concatenate components, drop remainders or leave numeral words behind. Convert a number-only transcript completely. Scales: thousand=10^3, lakh=10^5, crore=10^7, arab=10^9, kharab=10^11; `two hundred crore` → `2,00,00,00,000`; `twenty-five crore` → `25,00,00,000`. Check the digit count against the magnitude.
  - Except for currency-specific grouping below, use grouping commas only when the integer part has five or more digits (10,000 and above), and then in Indian style: the last group has three digits and preceding groups have two, as in `10,000`, `1,00,000`, and `1,23,456.78`. Write every number below 10,000 without commas, including four-digit quantities and the integer part of currency amounts: `2024`, `1030.5`, `$5365.52`. Do not group years, ordinal numbers, date/time fields, phone numbers, postal codes, house identifiers, fractions or structured letter-number codes. This applies only to newly converted numbers; preserve existing written numerals.
  - An explicit decimal marker becomes one decimal point: consume the complete integer part exactly once and retain every supplied fractional digit, including leading/trailing zeroes, in order; `one point four four liters` → `1.44 L`, never `one 1.44 L`. Do not separate the fractional digits, merge them into the integer part or replace an explicit decimal with a mixed fraction. Keep labels: `number one` → `number 1`.
  - Preserve spoken fractional modifiers and relationship words in quantities, durations and relative-time prose; digitize separately spoken numeric arguments without calculating an equivalent value. Do not turn a lexical fraction into a decimal, simplify a fraction, merge units or calculate a clock time. Parse complete numerator and denominator spans; a spoken numerator/separator/denominator may become `a/b` without evaluation; keep separately spoken whole parts and connectors. Preserve invalid zero-denominator expressions. Already-written fractions stay unchanged. Explicit decimals, rates, dates, identifiers and division prose follow their own rules.
  - Use the actual native ordinal ending, including gender and case; never invent English `st/nd/rd/th`. Express decades using native suffixes or words, not English `s`; preserve lexicalized decades without an established numeric form.

  ## Currency, percentages, units and rates

  - Convert the complete explicitly supplied currency expression, including amount and currency-unit words; never infer a currency from price context alone. Attach its symbol before the amount, including in right-to-left text, and `%` after it, without intervening spaces (`$52`, `3.5%`). Use Indian grouping for INR/Indian-system amounts (`₹1,00,000`) and Western three-digit grouping for USD/explicitly Western currencies (`$120,000`, not `$1,20,000`); amounts below 10,000 remain ungrouped.
  - For explicitly supplied major/minor units with 100 minor units per major unit, combine them, carry excess minor units and use two decimal places: `625 rupees and 2 paise` → `₹625.02`. Do not invent an amount, unit or qualifier.
  - Convert the measurement numeral and its licensed unit together, with one space between value and symbol, preserving surrounding grammatical material. Do not leave a licensed unit spoken after converting its quantity. Shared mappings include liter/litre→L, gram→g, degree Celsius→°C, watt→W, volt→V, centimeter→cm, beats per minute→bpm. Active-language examples license additional units and inflected/plural forms; leave unrecognized or ambiguous forms unchanged. Respect exponent notation (`56,030 cm²`). Time units follow the time rules.
  - Convert the complete explicit rate to `/` form, including a spoken denominator quantity: `seventy thousand rupees per ten grams` → `₹70,000/10 g`; `ninety kilometers per hour` → `90 km/h`. Do not leave the rate word partly spoken; ordinary non-rate wording is unchanged. Money ranges carry the currency symbol at both endpoints. Preserve surrounding connectors and endings.

  ## Dates and time

  - Dates retain native month names, date labels, ordinal endings and spoken component order. Newly converted days have no leading zero; years have no grouping. Separate components with spaces, without adding a comma before the year. Do not invent a missing day, month, year or era marker.
  - Use clock notation only with actual time-of-day context: an explicit current-time statement, AM/PM or a native clock cue. An unambiguous native o’clock-plus-minutes construction is a clock cue even without AM/PM; normalize its complete hour/minute span, not only its minute quantity. An hour/unit word alone, or AM/PM inside a name, is not sufficient. Parse mixed-language clock numbers; do not infer AM/PM.
  - Newly converted clocks use `H:MM`, `H:00` for whole hours and `H:MM:SS` only when seconds are supplied. Omit hour padding, pad minutes/seconds and keep a space before following words/endings. Retain day-period words, explicit AM/PM and grammatical clock cues.
  - For three- or four-digit clock spellings, expand repetitions first, then take the final two digits as minutes: `one two four five` → `12:45`; `double one zero zero` → `11:00`. Valid hours are 1–12 with AM/PM or 0–23 without; minutes/seconds are 0–59. For invalid or incomplete fields, digitize them separately in order without colons, carrying overflow, clamping or guesses: `the current time is one seventy-five` → `the current time is 1 75`.
  - Durations retain units, connectors and order: `one hour thirty minutes` → `1 hour 30 minutes`, not `1.5 hours` or a clock. Relative-time prose retains its relationship words: `quarter to twelve` → `quarter to 12`, not `11:45` or `quarter to 12:00`. Preserve existing written clocks exactly.

  ## Phones, identifiers and addresses

  - Digit-spelled phones, postal codes and house identifiers concatenate every supplied digit, repetition and leading zero. In digit-spelled fields, double/triple repeats the immediately following digit two/three times without dropping or reordering digits. Ordinary spoken zero becomes `0`; alternate zero readings require the licensed phone/time context. A digit-string reading `zero fourteen` → `014`; grouped/cardinal house numbers use their complete value. Preserve slash/hyphen identifiers and separate extension wording.
  - Domestic/service phones are contiguous digits without grouping or invented separators. An explicitly supplied country code uses `+<code> <national number>`; the spoken leading plus is a symbol, not arithmetic. Do not invent a country code.
  - Alphanumeric IDs form one token in spoken order: preserve native letter-name spellings and combining marks without transliteration, uppercase only supplied Latin letters and convert only numeric spans. Retain repetitions/zeroes; parse single-digit runs digit by digit and explicit cardinal groups as values. `A B C D E one two three four F` → `ABCDE1234F`; `F Y two zero two four` → `FY2024`; `A A zero zero seven` → `AA007`; `B twelve` → `B12`. Do not match prefixes inside ordinary words or names. Outside IDs, render recognized acronyms as the active-language examples show, without expansion.
  - Keep a space between separately spoken fields, such as a flight prefix and its flight number (`9W 334`); do not join unrelated fields. For a flight designator, join components within each field but keep exactly one space between the two fields: `9 W three three four` → `9W 334`; `9 W seven double seven eight` → `9W 7778`. This two-field rule takes precedence over the single-token ID rule above.

  ## Mathematics, titles and structural forms

  - Preserve mathematical prose, operator/relation words and descriptions of powers/roots; convert supplied operands/results without calculating missing results: `ten squared is one hundred` → `10 squared is 100`. Symbols require an explicit active-language dictation cue such as `write the equation:`; retain that cue/punctuation and map only explicitly spoken symbol names: `write the equation: five plus three equals eight` → `write the equation: 5 + 3 = 8`. A supplied result or the word equals alone is not a dictation cue; without the cue, use `5 plus 3 equals 8`. Explicit signed quantities retain their sign (`minus five degrees` → `-5 degrees`); existing notation stays unchanged.
  - Use Roman numerals only for licensed regnal or chapter-like identifiers (`Louis the Fourteen` → `Louis XIV`; `chapter four` → `chapter IV`).
  - Abbreviate recognized titles only directly before a person's name, using active-language forms. Explicit Mister, Miss/Ms and Mrs become `Mr.`, `Ms.` and `Mrs.` with periods; keep `Ms.` and `Mrs.` distinct. Preserve the name's spelling/script; keep standalone, predicative, plural, inflected or suffix-attached profession words unchanged.
  - Convert spoken structural forms to `.`, `@`, `/`, `:` or `-` only in their licensed context. In spoken emails/URLs, join explicitly spoken Latin components and preserve their spelling: `jane doe at gmail dot com` → `janedoe@gmail.com`. Do not substitute words or spelling variants.

  Spoken-form transcript in {language}:
  {text}
