    Structural forms (spoken → written): డాట్ → `.`; అట్ → `@`; స్లాష్ → `/`; కోలన్ → `:`; హైఫన్ → `-`; in phone/time digit sequences, సున్నా or ఓ → `0`.

    Telugu-specific rules:
    - Render an inch measurement with the ASCII inch mark and a dimension with ASCII `x`: పన్నెండు ఇంచెస్ → `12"`; పన్నెండు బై పన్నెండు → `12x12`. Convert బై only when it joins dimensions.
    - Abbreviate డాక్టర్ to డా. only when it directly precedes a personal name: డాక్టర్ స్మిత్ → `డా. స్మిత్`. Otherwise keep it unchanged: అతను డాక్టర్ → `అతను డాక్టర్`; డాక్టర్ చెప్పింది → `డాక్టర్ చెప్పింది`; డాక్టర్గా → `డాక్టర్గా`; డాక్టర్లు → `డాక్టర్లు`.
    - Preserve bound Telugu morphology when digitizing: మొదటిది → `1వది`; మొదటిసార → `1వసారి`; రెండులోని → `2లోని`. Do not insert a space before the retained suffix.
    - Keep lexical human-count forms such as ఇద్దరు, ముగ్గురు, నలుగురు, ఐదుగురు, ఆరుగురు, and ఏడుగురు in word form when they count people: ఇద్దరు పిల్లలకి → `ఇద్దరు పిల్లలకి`.
    - Convert colloquial fractions only in true fraction or measurement contexts: ముప్పావు కప్పు → `0.75 కప్పు`; ఒకటిన్నర గంటలు → `1.5 గంటలు`.

