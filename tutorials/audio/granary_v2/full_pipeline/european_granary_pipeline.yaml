# European recording-to-transcript pipeline; see README.md. Run with: main.py -cn european_granary_pipeline
defaults:
  - common
  - prompts
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

documentation: |
  Extract metadata and Opus speech clips from recordings (language ID: SpeechBrain
  + Whisper), keep clips in 24 European languages, transcribe each language group
  with its primary and recovery model (Qwen3-Omni + Qwen3-ASR, Parakeet-v3 + Whisper,
  Whisper + Parakeet-v3), then enrich the selected text.
  metadata.jsonl retains every metadata result, including rejected/audit rows;
  european.jsonl contains the selected clips with ASR and text features.

output_path: ${output_dir}/european.jsonl

stages:
  - ${shared.manifest_reader}
  - ${shared.resample_audio_stage}
  - ${shared.mono_conversion_stage}
  - ${shared.inference_sortformer_stage}
  - ${shared.v_a_d_segmentation_stage}
  - ${shared.s_e_d_inference_stage}
  - ${shared.s_e_d_postprocessing_stage}
  - ${shared.speech_brain_lang_i_d}
  - ${shared.whisper_lang_i_d}
  - ${shared.select_audio_language_stage}
  - ${shared.audio_segment_writer_stage}
  - ${shared.metadata_manifest_writer}

  # Keep the full metadata audit above; only clips in the European languages below reach ASR.
  - _target_: nemo_curator.stages.audio.common.PreserveByValueConditionsStage
    _convert_: all
    conditions:
      - {input_value_key: source_lang, target_value: de, operator: eq}
      - {input_value_key: source_lang, target_value: es, operator: eq}
      - {input_value_key: source_lang, target_value: fr, operator: eq}
      - {input_value_key: source_lang, target_value: it, operator: eq}
      - {input_value_key: source_lang, target_value: pt, operator: eq}
      - {input_value_key: source_lang, target_value: ru, operator: eq}
      - {input_value_key: source_lang, target_value: nl, operator: eq}
      - {input_value_key: source_lang, target_value: pl, operator: eq}
      - {input_value_key: source_lang, target_value: cs, operator: eq}
      - {input_value_key: source_lang, target_value: ro, operator: eq}
      - {input_value_key: source_lang, target_value: hu, operator: eq}
      - {input_value_key: source_lang, target_value: el, operator: eq}
      - {input_value_key: source_lang, target_value: fi, operator: eq}
      - {input_value_key: source_lang, target_value: da, operator: eq}
      - {input_value_key: source_lang, target_value: sv, operator: eq}
      - {input_value_key: source_lang, target_value: lt, operator: eq}
      - {input_value_key: source_lang, target_value: lv, operator: eq}
      - {input_value_key: source_lang, target_value: hr, operator: eq}
      - {input_value_key: source_lang, target_value: et, operator: eq}
      - {input_value_key: source_lang, target_value: bg, operator: eq}
      - {input_value_key: source_lang, target_value: sk, operator: eq}
      - {input_value_key: source_lang, target_value: sl, operator: eq}
      - {input_value_key: source_lang, target_value: mt, operator: eq}
      - {input_value_key: source_lang, target_value: uk, operator: eq}
    condition_logic: or
    missing_value_policy: drop
  - ${shared.resample_english_clip}
  - _target_: nemo_curator.stages.audio.inference.asr.stage.ASRStage
    waveform_key: waveform
    sample_rate_key: sample_rate
    keep_waveform: true
    name: QwenOmni_primary
    adapter_target: nemo_curator.models.asr.qwen_omni.QwenOmniASRAdapter
    model_id: ${model_id}
    supported_language_codes: [de, es, fr, it, pt, ru, nl]
    unsupported_language_marks_skip: false
    pred_text_key: primary_model_prediction
    batch_size: 64
    max_audio_sec_per_actor: 960.0
    max_inference_duration_s: 30.0
    local_bucketing: false
    resources:
      _target_: nemo_curator.stages.resources.Resources
      gpus: 2
    adapter_kwargs:
      revision: ${model_revision}
      prompt_content_order: text_audio
      max_output_tokens: 256
      vllm_kwargs:
        max_model_len: 4096
        max_num_seqs: 128
        gpu_memory_utilization: 0.85
        dtype: auto
        trust_remote_code: true
        enable_prefix_caching: true
        prefix_caching_hash_algo: xxhash
        # Audio only. With vLLM 0.22 any image or video slot makes the engine profile Qwen3-Omni's vision encoder at
        # start-up, which fails with "cu_seqlens_q must be on CUDA" (the adapter's own default is the same).
        limit_mm_per_prompt:
          image: 0
          video: 0
          audio: 2
        seed: 1234
      sampling_kwargs:
        temperature: 0.0
        top_k: 1
        repetition_penalty: 1.0
      prompt_text: ${prompts.omni_asr}

  - _target_: nemo_curator.stages.audio.inference.asr.stage.ASRStage
    waveform_key: waveform
    sample_rate_key: sample_rate
    keep_waveform: true
    name: ParakeetV3_primary
    adapter_target: nemo_curator.models.asr.nemo_asr.NeMoASRAdapter
    model_id: nvidia/parakeet-tdt-0.6b-v3
    supported_language_codes: [pl, cs, ro, hu, el, fi, da, sv]
    unsupported_language_marks_skip: false
    skip_if_output_exists: true
    max_audio_sec_per_actor: 2400.0
    pred_text_key: primary_model_prediction
    batch_size: 64
    adapter_kwargs:
      empty_audio_marks_skip: false
      use_cuda_graph_decoder: false
    resources:
      _target_: nemo_curator.stages.resources.Resources
      gpu_memory_gb: 8

  - _target_: nemo_curator.stages.audio.inference.asr.stage.ASRStage
    waveform_key: waveform
    sample_rate_key: sample_rate
    keep_waveform: true
    name: Whisper_primary
    adapter_target: nemo_curator.models.asr.faster_whisper.FasterWhisperASR
    model_id: large-v3
    supported_language_codes: [lt, lv, hr, et, bg, sk, sl, mt, uk]
    unsupported_language_marks_skip: false
    skip_if_output_exists: true
    max_audio_sec_per_actor: 2400.0
    pred_text_key: primary_model_prediction
    batch_size: 16
    resources:
      _target_: nemo_curator.stages.resources.Resources
      gpu_memory_gb: 16
  - ${shared.whisper_hallucination_primary}

  - _target_: nemo_curator.stages.audio.inference.asr.stage.ASRStage
    waveform_key: waveform
    sample_rate_key: sample_rate
    keep_waveform: true
    name: QwenASR_recovery
    run_only_if_hallucinated: ${recovery_only_if_hallucinated}
    skip_if_output_exists: true
    adapter_target: nemo_curator.models.asr.qwen_asr.QwenASRAdapter
    model_id: ${recovery_model_id}
    supported_language_codes: [de, es, fr, it, pt, ru, nl]
    unsupported_language_marks_skip: false
    # An empty recovery result must not replace the primary hallucination flag.
    preserve_existing_skip: true
    pred_text_key: fallback_model_prediction
    batch_size: 128
    max_audio_sec_per_actor: 5120.0
    adapter_kwargs:
      revision: ${recovery_model_revision}
      gpu_memory_utilization: 0.95
      max_new_tokens: 4096
      max_inference_batch_size: 128

  - _target_: nemo_curator.stages.audio.inference.asr.stage.ASRStage
    waveform_key: waveform
    sample_rate_key: sample_rate
    keep_waveform: true
    name: Whisper_recovery
    run_only_if_hallucinated: ${recovery_only_if_hallucinated}
    skip_if_output_exists: true
    adapter_target: nemo_curator.models.asr.faster_whisper.FasterWhisperASR
    supported_language_codes: [pl, cs, ro, hu, el, fi, da, sv]
    unsupported_language_marks_skip: false
    preserve_existing_skip: true
    max_audio_sec_per_actor: 2400.0
    pred_text_key: fallback_model_prediction
    model_id: large-v3
    batch_size: 16
    resources:
      _target_: nemo_curator.stages.resources.Resources
      gpu_memory_gb: 16

  - _target_: nemo_curator.stages.audio.inference.asr.stage.ASRStage
    waveform_key: waveform
    sample_rate_key: sample_rate
    keep_waveform: true
    name: ParakeetV3_recovery
    run_only_if_hallucinated: ${recovery_only_if_hallucinated}
    skip_if_output_exists: true
    adapter_target: nemo_curator.models.asr.nemo_asr.NeMoASRAdapter
    supported_language_codes: [lt, lv, hr, et, bg, sk, sl, mt, uk]
    unsupported_language_marks_skip: false
    preserve_existing_skip: true
    max_audio_sec_per_actor: 2400.0
    pred_text_key: fallback_model_prediction
    model_id: nvidia/parakeet-tdt-0.6b-v3
    batch_size: 64
    adapter_kwargs:
      empty_audio_marks_skip: false
      use_cuda_graph_decoder: false
    resources:
      _target_: nemo_curator.stages.resources.Resources
      gpu_memory_gb: 8
  - ${shared.whisper_hallucination_asr}
  - ${shared.select_best_prediction_stage}
  - ${shared.drop_clip_waveform}
  - ${shared.regex_substitution_stage}
  - ${shared.abbreviation_concat_stage}
  - ${shared.recover_entities}
  - ${shared.pn_c_restoration}
  - ${shared.language_i_d}
  - ${shared.text_normalization}
  - ${shared.fused_text_l_l_m}
  - ${shared.i_t_n_restoration}
  - ${shared.disfluency_removal}
  - ${shared.manifest_writer_stage}
