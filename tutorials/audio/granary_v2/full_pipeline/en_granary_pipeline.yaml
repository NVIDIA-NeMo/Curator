# English recording-to-transcript pipeline; see README.md. Run with: main.py -cn en_granary_pipeline
defaults:
  - common
  - prompts
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

documentation: |
  Extract metadata and Opus speech clips from recordings (language ID: SpeechBrain
  + Whisper), retain English clips, transcribe with Qwen3-Omni and Qwen3-ASR
  recovery, then enrich the selected text.
  metadata.jsonl retains every metadata result, including rejected/audit rows;
  english.jsonl contains the selected English clips with ASR and text features.

output_path: ${output_dir}/english.jsonl

stages:
  - ${shared.manifest_reader}
  - ${shared.resample_audio_stage}
  - ${shared.inference_sortformer_stage}
  - ${shared.v_a_d_segmentation_stage}
  - ${shared.s_e_d_inference_stage}
  - ${shared.s_e_d_postprocessing_stage}
  - ${shared.speech_brain_lang_i_d}
  - ${shared.whisper_lang_i_d}
  - ${shared.select_audio_language_stage}
  - ${shared.audio_segment_writer_stage}
  - ${shared.metadata_manifest_writer}

  # Keep the full metadata audit above; only selected English clips reach ASR.
  - _target_: nemo_curator.stages.audio.common.PreserveByValueStage
    input_value_key: source_lang
    target_value: en
    operator: eq
    missing_value_policy: drop
  - ${shared.resample_english_clip}
  - _target_: nemo_curator.stages.audio.inference.asr.stage.ASRStage
    waveform_key: waveform
    sample_rate_key: sample_rate
    keep_waveform: true
    adapter_target: nemo_curator.models.asr.qwen_omni.QwenOmniASRAdapter
    model_id: ${model_id}
    default_language: en
    supported_language_codes: [en, zh, ko, ja, de, ru, it, fr, es, pt, ms, nl, id, tr, vi, yue, ar, ur]
    unsupported_language_marks_skip: false
    pred_text_key: primary_model_prediction
    batch_size: 64
    max_audio_sec_per_actor: 960.0
    max_inference_duration_s: 30.0
    local_bucketing: false
    resources:
      _target_: nemo_curator.stages.resources.Resources
      gpus: 2
    adapter_kwargs:
      revision: ${model_revision}
      prompt_content_order: text_audio
      max_output_tokens: 256
      vllm_kwargs:
        max_model_len: 4096
        max_num_seqs: 128
        gpu_memory_utilization: 0.85
        dtype: auto
        trust_remote_code: true
        enable_prefix_caching: true
        prefix_caching_hash_algo: xxhash
        # Audio only. With vLLM 0.22 any image or video slot makes the engine profile Qwen3-Omni's vision encoder at
        # start-up, which fails with "cu_seqlens_q must be on CUDA" (the adapter's own default is the same).
        limit_mm_per_prompt:
          image: 0
          video: 0
          audio: 2
        seed: 1234
      sampling_kwargs:
        temperature: 0.0
        top_k: 1
        repetition_penalty: 1.0
      prompt_text: ${prompts.omni_asr}
      en_prompt_text: ${prompts.omni_asr_english}
  - ${shared.whisper_hallucination_primary}

  - _target_: nemo_curator.stages.audio.inference.asr.stage.ASRStage
    waveform_key: waveform
    sample_rate_key: sample_rate
    keep_waveform: false
    name: QwenASR_recovery
    adapter_target: nemo_curator.models.asr.qwen_asr.QwenASRAdapter
    model_id: ${recovery_model_id}
    default_language: en
    supported_language_codes: [en]
    # An empty recovery result must not replace the primary hallucination flag.
    preserve_existing_skip: true
    pred_text_key: fallback_model_prediction
    batch_size: 128
    max_audio_sec_per_actor: 5120.0
    # vLLM profiles memory on its own GPU: a shared GPU fails its start-up check, so it keeps one whole GPU.
    adapter_kwargs:
      revision: ${recovery_model_revision}
      gpu_memory_utilization: 0.95
      max_new_tokens: 4096
      max_inference_batch_size: 128
  - ${shared.whisper_hallucination_asr}
  - ${shared.select_best_prediction_stage}
  - ${shared.regex_substitution_stage}
  - ${shared.abbreviation_concat_stage}
  - ${shared.pn_c_restoration}
  - ${shared.text_normalization}
  - ${shared.fused_text_l_l_m}
  - ${shared.language_verification}
  - ${shared.i_t_n_restoration}
  - ${shared.disfluency_removal}
  - ${shared.manifest_writer_stage}
