defaults:
  - _self_
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none

hydra:
  run:
    dir: .
  output_subdir: null

documentation: |
  MLS + MFA Pipeline with ASR WER Filtering and MFA Adaptation
  #############################################################

  Extended pipeline: ASR-based transcript verification (WER filtering)
  and MFA model adaptation before final alignment.

  **Stages** (set ``stage`` to skip earlier ones):
     1  Download and extract MLS data
     2  Prepare Lhotse recordings + supervisions
     3  Download MFA models
     4  Create Lhotse cutsets
     5  Resample audio to 16 kHz; write stage5_tasks.jsonl
     6  Transcript normalization + num2words; write stage6_tasks.jsonl
     7  ASR transcription + WER filtering; write stage7_tasks.jsonl
     8  MFA model adaptation (optional subset)
     9  MFA forced alignment (uses adapted model)
    10  Merge TextGrids into Lhotse aligned cutsets
    11  Rewrite recording paths to resampled WAV files

# ── Required paths (override on command line) ─────────────────────────────
mls_src_dir: ???
data_dir: ???
manifests_dir: ???

# ── Language ──────────────────────────────────────────────────────────────
language: french
splits:
  - train

# ── MFA models ────────────────────────────────────────────────────────────
mfa_acoustic: "french_mfa"
mfa_dict: "french_mfa"
mfa_g2p: "french_mfa"
mfa_tokenizer: ""
mfa_root_dir: "/home/ttimofeeva/MFA_models"

# ── MFA alignment parameters ─────────────────────────────────────────────
beam: 100
retry_beam: 400
output_format: long_textgrid

# ── ASR backend ──────────────────────────────────────────────────────────
# asr_backend: "nemo" or "whisper"
asr_backend: "nemo"

# NeMo ASR model (used when asr_backend=nemo)
# Options:
#   nvidia/stt_fr_conformer_transducer_large  (French Conformer Transducer)
#   nvidia/stt_fr_conformer_ctc_large         (French Conformer CTC)
#   nvidia/parakeet-tdt-0.6b-v2               (English Parakeet)
asr_model_name: "nvidia/stt_fr_conformer_transducer_large"

# Whisper settings (used when asr_backend=whisper)
whisper_model_size: "large-v3"
whisper_language: "french"

# ── MFA adaptation ───────────────────────────────────────────────────────
# Hours for adaptation subset (0 = use full WER-filtered set)
adapt_subset_hours: 200

# ── Processing ────────────────────────────────────────────────────────────
num_jobs: 16
stage: 1
target_sample_rate: 16000
opus: false

# ── Silence markers ──────────────────────────────────────────────────────
silence_markers:
  - ""
  - sp
  - sil
  - spn
  - "<eps>"
