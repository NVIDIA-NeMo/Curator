# Improve existing human transcripts with Qwen3-Omni, then recover hallucinations
# from the original text and normalize the selected prediction.
# Run from the repository root; see README.md for the input contract.

defaults:
  - _self_
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none

hydra:
  run:
    dir: .
  output_subdir: null

manifest_path: ???
output_path: ./qwen_omni_reference_improvement_output.jsonl
workspace_dir: /tmp/qwen_omni_reference_improvement_workspace
resampled_audio_dir: ${workspace_dir}/audio_resampled
reference_text_key: text
model_id: Qwen/Qwen3-Omni-30B-A3B-Instruct
model_revision: 26291f793822fb6be9555850f06dfe95f2d7e695
default_language: en
supported_language_codes: [en, zh, ko, ja, de, ru, it, fr, es, pt, ms, nl, id, tr, vi, yue, ar, ur]
prompt_file: tutorials/audio/qwen_omni_reference_improvement/prompts/multilingual.md
en_prompt_file: tutorials/audio/qwen_omni_reference_improvement/prompts/english.md
common_hall_file: tutorials/audio/whisper_hallucination/phrases.txt
regex_params_yaml: tutorials/audio/qwen_omni_reference_improvement/regex_rules.yaml
gpus_per_actor: 2
batch_size: 32
max_num_seqs: 16
max_model_len: 4096
max_output_tokens: 256
gpu_memory_utilization: 0.90
# A whole utterance needs one aligned reference; reference mode rejects splitting.
max_inference_duration_s: 30.0
max_audio_sec_per_actor: 960.0
local_bucketing: false
backend: ray_data
execution_mode: streaming

stages:
  - _target_: nemo_curator.stages.audio.common.ManifestReader
    manifest_path: ${manifest_path}
    files_per_partition: 1

  - _target_: nemo_curator.stages.audio.tagging.ResampleAudioStage
    resampled_audio_dir: ${resampled_audio_dir}
    target_sample_rate: 16000
    target_format: wav
    target_nchannels: 1

  - _target_: nemo_curator.stages.audio.inference.asr.stage.ASRStage
    adapter_target: nemo_curator.models.asr.qwen_omni.QwenOmniASRAdapter
    model_id: ${model_id}
    reference_text_key: ${reference_text_key}
    default_language: ${default_language}
    supported_language_codes: ${supported_language_codes}
    unsupported_language_marks_skip: false
    pred_text_key: primary_model_prediction
    batch_size: ${batch_size}
    max_audio_sec_per_actor: ${max_audio_sec_per_actor}
    max_inference_duration_s: ${max_inference_duration_s}
    local_bucketing: ${local_bucketing}
    resources:
      _target_: nemo_curator.stages.resources.Resources
      gpus: ${gpus_per_actor}
    adapter_kwargs:
      revision: ${model_revision}
      prompt_file: ${prompt_file}
      en_prompt_file: ${en_prompt_file}
      prompt_content_order: text_audio
      max_output_tokens: ${max_output_tokens}
      vllm_kwargs:
        max_model_len: ${max_model_len}
        max_num_seqs: ${max_num_seqs}
        gpu_memory_utilization: ${gpu_memory_utilization}
        dtype: auto
        trust_remote_code: true
        enable_prefix_caching: true
        prefix_caching_hash_algo: xxhash
        # Keep vision slots enabled to avoid meta DeepStack buffers during startup
        # in affected vLLM releases: https://github.com/vllm-project/vllm/issues/49384.
        limit_mm_per_prompt:
          image: 1
          video: 1
          audio: 2
        seed: 1234
      sampling_kwargs:
        temperature: 0.0
        top_k: 1
        repetition_penalty: 1.0

  - _target_: nemo_curator.stages.audio.text_filtering.WhisperHallucinationStage
    name: WhisperHallucination_primary
    common_hall_file: ${common_hall_file}
    text_key: primary_model_prediction
    language_key: source_lang
    unique_words_threshold: 0.4
    long_word_threshold: 25
    long_word_rel_threshold: 3.0
    max_char_rate: 40.0

  - _target_: nemo_curator.stages.audio.text_filtering.SelectBestPredictionStage
    primary_text_key: primary_model_prediction
    reference_text_key: ${reference_text_key}
    use_reference_on_hallucination: true
    use_ground_truth_for_short_audio: false
    output_key: best_prediction

  - _target_: nemo_curator.stages.audio.text_filtering.RegexSubstitutionStage
    regex_params_yaml: ${regex_params_yaml}
    text_key: best_prediction
    output_text_key: cleaned_text

  - _target_: nemo_curator.stages.audio.text_filtering.AbbreviationConcatStage
    text_key: cleaned_text
    output_text_key: abbreviated_text
    source_lang_key: source_lang
    default_language: ${default_language}

  - _target_: nemo_curator.stages.audio.common.ManifestWriterStage
    output_path: ${output_path}
