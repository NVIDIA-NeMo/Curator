[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnifuse-curator-tutorial"
version = "0.1.0"
description = "Standalone NeMo Curator tutorial for Omni-Fuse multimodal data curation."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "nemo-curator>=1.3.0,<2",
    "numpy>=1.26,<2.5",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "spacy>=3.8.14,<4",
    "torch>=2.11,<2.12",
    "accelerate>=0.26",
    "einops>=0.6",
    "easydict>=1.13",
    "huggingface_hub>=0.25",
    "ffmpeg-python",
    "future",
    "fvcore",
    "lighthouse @ git+https://github.com/line/lighthouse.git",
    "librosa>=0.10,<0.12",
    "msclap",
    "nvidia-ml-py>=12",
    "opencv-python>=4,<5",
    "Pillow>=10,<12",
    "qwen-vl-utils>=0.0.8",
    "sentence-transformers>=2.2,<4",
    "soundfile>=0.12",
    "torchlibrosa",
    "torchcodec>=0.11,<0.12",
    "clip @ git+https://github.com/openai/CLIP.git",
    "torchaudio>=2.11,<2.12",
    "torchvision>=0.26,<0.27",
    "transformers>=4.57,<5",
    "en-core-web-sm",
    "peft>=0.19.1",
    "decord>=0.6.0",
    "pytorchvideo>=0.1.5",
]

[tool.uv]
override-dependencies = [
    "numpy>=1.26,<2.5",
    "transformers>=4.57,<5",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
torch = { index = "pytorch-cu128", marker = "sys_platform == 'linux'" }
torchaudio = { index = "pytorch-cu128", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cu128", marker = "sys_platform == 'linux'" }
# Pull torchcodec from PyPI (CPU FFmpeg build) rather than pytorch-cu128, whose wheel links libnppicc.so.12.

[tool.setuptools]
packages = ["omnifuse_tutorial"]
