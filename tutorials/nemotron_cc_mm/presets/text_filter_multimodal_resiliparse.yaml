# OmniCorpus — Stage 2 (text filter, multimodal-tuned, RESILIPARSE text)
# ----------------------------------------------------------------------
# Identical to text_filter_multimodal.yaml — same 12 enabled filters,
# same Gopher/C4 thresholds, same word_count_min=20 multimodal tweak,
# same lang_id off / lang_id_annotate on — EXCEPT every doc-level
# filter pulls its aggregated text from the metadata row's Resiliparse
# output (text_source: metadata) instead of concatenating magic-html
# paragraphs (text_source: text_rows, the default).
#
# Use to measure how Stage-2 drop rates and final doc count change
# when the heuristic filters consume Resiliparse's full-doc text
# (chrome + body) rather than magic-html's main-content paragraphs.
#
# Reads:    Parquet from Stage 1 (full extracted rows; metadata-row
#           text_content carries Resiliparse text — extract preset
#           sets resiliparse_text: true).
# Writes:   Parquet with text-filter survivors.
# Resources: CPU only.  Deterministic — same input → same output.

name: text_filter_multimodal_resiliparse
description: Stage 2 multimodal-tuned text filter, text_source=metadata (Resiliparse)

input_type: parquet

# ======================================================================
# ① Extraction settings (ignored on Parquet input)
# ======================================================================
extractor: magic_traf
min_text_chars: 1
max_text_chars: 50000
resiliparse_text: false
max_batch_bytes: 268435456

# ======================================================================
# ② Heuristic doc-level filters — 12 enabled, lang_id + bad_words OFF
#    Identical settings to text_filter_multimodal.yaml.
# ======================================================================
text_source: metadata          # <-- the only change vs text_filter_multimodal.yaml

url_substr_nsfw: true
lorem_ipsum: true
word_count: true
mean_word_length: true
symbol_ratio: true
stopword_count: true
ngram_repetition: true
alpha_ratio: true
ellipsis_line: true
bullet_line: true
dup_line: true
top_word: true
continuous_line_breaks: true
bad_words: false
lang_id: false
lang_id_annotate: true

# Thresholds — Gopher/C4 defaults except word_count_min (multimodal tweak)
word_count_min: 20             # ↓ from 50 — keep caption-rich pages
word_count_max: 100000
mean_word_length_min: 3.0
mean_word_length_max: 10.0
symbol_ratio_max: 0.1
stopword_count_min: 2
alpha_ratio_min: 0.8
ellipsis_line_max: 0.3
bullet_line_max: 0.9
dup_line_max: 0.3
top_word_max: 0.30
continuous_line_breaks_max: 0.05
bad_words_path: ""

# ======================================================================
# ③ Detailed Filter + Safety — DISABLED
# ======================================================================
pii_redact: false

# ======================================================================
# ④ Image stages — ALL DISABLED (handled by Stage 3 / Stage 4)
# ======================================================================
image_download: false
image_url_dedup: false
image_geometry: false
image_aspect_ratio: false
image_nsfw: false
image_aesthetic: false
image_count: false
