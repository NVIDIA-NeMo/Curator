# OmniCorpus — text-only / deterministic variant
# ----------------------------------------------------------------------
# Same recipe as omnicorpus_cpu.yaml but with the image-acquire and
# image-filter stages disabled.  Use this for:
#
#   * Filter-funnel sanity checks (no network → no download stochasticity)
#   * Bit-reproducible runs across hosts (deterministic given same WARC)
#   * Fast local dev iteration (no image bytes in memory or Parquet)
#
# Disabled here:
#   * Stage ④ — image_download   (network, flaky)
#   * Stage ④ — image_geometry   (depends on binary_content)
#   * Stage ④ — image_aspect_ratio
#   * Stage ④ — image_nsfw       (GPU)
#   * Stage ④ — image_aesthetic  (GPU)
#   * Stage ④ — image_count      (would drop all docs without images)
#
# Note: the extractor still emits image *URL* rows; with all image stages
# off they pass straight through to Parquet with binary_content = null.
# Doc/row/token funnel for the text filters is identical to omnicorpus_cpu
# *up to* image-download stochasticity — which is exactly what we want.

name: omnicorpus_text_only
description: Text-only deterministic OmniCorpus subset — no image download, no GPU stages

# ======================================================================
# ① Main Body Extraction
# ======================================================================
extractor: hybrid
min_text_chars: 1
max_text_chars: 50000            # cap pathological multi-MB rows at extraction
resiliparse_text: true
max_batch_bytes: 268435456       # 256 MiB chunked extraction

# ======================================================================
# ② Preliminary Text Filtering — 14 doc-level filters
# ======================================================================
url_substr_nsfw: true
lorem_ipsum: true
word_count: true
mean_word_length: true
symbol_ratio: true
stopword_count: true
ngram_repetition: true
alpha_ratio: true
ellipsis_line: true
bullet_line: true
dup_line: true
top_word: true
continuous_line_breaks: true
bad_words: false
lang_id: true

word_count_min: 50
word_count_max: 100000
mean_word_length_min: 3.0
mean_word_length_max: 10.0
symbol_ratio_max: 0.1
stopword_count_min: 2
alpha_ratio_min: 0.8
ellipsis_line_max: 0.3
bullet_line_max: 0.9
dup_line_max: 0.3
top_word_max: 0.30
continuous_line_breaks_max: 0.05
lang_id_target: en
lang_id_min_score: 0.65
bad_words_path: ""

# ======================================================================
# ④ Image stages — ALL DISABLED
# ======================================================================
image_download: false
image_url_dedup: false
image_geometry: false
image_aspect_ratio: false
image_nsfw: false
image_aesthetic: false
image_count: false

# ======================================================================
# ⑤ Detailed Filter + Safety (deterministic CPU regex)
# ======================================================================
pii_redact: true
pii_email: true
pii_phone: true
pii_ipv4: true
pii_ssn: true
pii_alt_text: false
